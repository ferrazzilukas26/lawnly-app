function Piano({prof,wx,setPg}){
  const [chat,setChat]=useState(false);
  const raw=(S.get('dss_calendar_events',[])||[]);
  const evs=raw.filter(Boolean).map(e=>{
    const dstr=(e.date||e.dt||'');const d=dstr?new Date(dstr):null;
    const title=e.name||e.title||((e.product&&e.brand)?(e.product+' — '+e.brand):(e.product||'Operazione'));
    const done=!!(e.status==='completato'||e.status==='done'||e.done||e.completed);
    const dose=e.dose||((e.qty&&e.unit)?(e.qty+' '+e.unit):'')||'';
    const doseArea=[dose,e.area?(e.area+' m²'):''].filter(Boolean).join(' · ');
    // PATCH v9 — risolvi il nome prodotto dal catalogo (eventi AI: brand/product null, solo *ProductId)
    const _prodName=(()=>{
      if(e.product)return [e.brand,e.product].filter(Boolean).join(' ').trim();
      try{const getFn=window.__LAWNLY_GET_PRODUCT__;const pid=e.finalProductId||e.suggestedProductId;if(getFn&&pid){const p=getFn(pid);if(p)return [p.brand,p.name].filter(Boolean).join(' ').trim();}}catch(_e){}
      return null;
    })();
    return {d,title,sub:e.note||e.description||e.sub||e.category||e.type||'',dose:doseArea,done,cat:e.category||e.type||e.name||'',product:_prodName,qty:e.qtyUsed||e.consumo||null,zona:e.zona||e.zone||null,id:e.id||null,_raw:e};
  }).filter(x=>x.d&&!isNaN(x.d.getTime()));

  const [view,setView]=useState('prog');
  const [openG,setOpenG]=useState(0);
  const [regen,setRegen]=useState(false);
  const [tick,setTick]=useState(0);
  const _isDoneOp=(e)=>!!(e&&(e.status==='completato'||e.status==='done'||e.done||e.completed));
  const _isSkipped=(e)=>!!(e&&['saltato','saltata','posticipato'].includes(e.status));
  // Cosa sopravvive a una rigenerazione: tutto ciò che porta traccia dell'utente.
  // Prima restavano solo le completate, e sparivano le saltate, le operazioni aggiunte a mano
  // e quelle passate mai chiuse — cioè il diario di chi stava usando l'app.
  const _isUserOp=(e)=>{
    if(!e)return false;
    if(_isDoneOp(e)||_isSkipped(e)||e.confirmed)return true;
    if(!e.ai_generated)return true;                                   // aggiunta o modificata a mano
    const dk=(e.date||e.dt||'').slice(0,10);
    return !!dk && dk < new Date().toISOString().slice(0,10);         // passata: è storia, non proposta
  };
  // Fonde piano rigenerato con la storia: tiene le operazioni dell'utente e aggiunge
  // solo le nuove proposte FUTURE non già coperte nello stesso mese/categoria.
  const mergePlan=(keptOps,planned)=>{
    const todayK=new Date().toISOString().slice(0,10);
    const key=(e)=>((e.month||(e.date?new Date(e.date).getMonth()+1:0))+'|'+((e.category||e.type||'')+'').toLowerCase());
    const keptKeys=new Set(keptOps.map(key));
    const futurePlanned=(planned||[]).filter(p=>{const dk=(p.date||p.dt||'').slice(0,10);return dk>=todayK&&!keptKeys.has(key(p));});
    return [...keptOps,...futurePlanned];
  };
  const lastRegen=(S.get('dss_plan_last_regen',0))||0;
  const daysSinceRegen=lastRegen?((Date.now()-lastRegen)/86400000):999;
  const regenUnlocked=daysSinceRegen>=14;
  const nextRegenDays=Math.max(0,Math.ceil(14-daysSinceRegen));
  const doRegen=()=>{
    if(regen)return; setRegen(true);
    try{S.set('dss_plan_last_regen',Date.now());}catch(e){}
    try{
      const existing=S.get('dss_calendar_events',[])||[];
      const doneOps=existing.filter(_isUserOp);
      const gardenData={...(prof||{}),zones:(prof&&prof.zones)||[]};
      const profile=(S.get('dss_profile',prof||{}))||{};
      let ops=[];
      try{ if(typeof generateFallbackPlan==='function') ops=generateFallbackPlan(gardenData,profile)||[]; }catch(e){}
      ops=(ops||[]).map(o=>o&&!_isDoneOp(o)?{...o,status:'da_valutare',ai_generated:true}:o); // B.3: proposte AI da valutare
      const merged=mergePlan(doneOps,ops);
      if(merged.length){ try{saveCalendarEvents(merged);}catch(e){} try{window.dispatchEvent(new CustomEvent('lawnly:sync'));}catch(e){} }
      try{
        if(typeof generateAnnualPlan==='function'){
          generateAnnualPlan({gardenData,profile,weather:wx,diagnosisInputs:{}},{maxTokens:4000,useHaiku:false,timeoutMs:45000,backgroundRefine:true})
            .then(newOps=>{ if(newOps&&newOps.length){ const m2=mergePlan(doneOps,newOps.map(o=>o&&!_isDoneOp(o)?{...o,status:'da_valutare',ai_generated:true}:o)); try{saveCalendarEvents(m2);}catch(e){} try{window.dispatchEvent(new CustomEvent('lawnly:sync'));}catch(e){} setTick(t=>t+1);} })
            .catch(()=>{});
        }
      }catch(e){}
    }catch(e){}
    setTimeout(()=>{ setRegen(false); setTick(t=>t+1); },700);
  };
  const [detail,setDetail]=useState(null);
  const _X=html`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>`;
  const _dval=(l,r)=>html`<div class="dt-val"><span class="dt-val-l">${l}</span><span class="dt-val-r">${r}</span></div>`;

        try{if(typeof queueOperationFeedback==='function')queueOperationFeedback({type:fbType,operation:all[i],oldOperation:null,gardenData:prof,profile:prof,gdd:wx});}catch(e){}

  const skipOp=(ev)=>{
    if(_isMandatory(ev)&&typeof window!=='undefined'&&!window.confirm('"'+(ev.name||ev.title||'Operazione')+'" è una lavorazione chiave nella sua finestra stagionale (es. concimazione). Saltarla può compromettere il prato.\n\nSaltare comunque?'))return;

    const DELTA=7;

      const all=S.get('dss_calendar_events',[])||[];
      const base=new Date(ev.date||ev.dt||Date.now());
      const next=all.map(e=>{
        if(!e)return e;
        const ed=new Date(e.date||e.dt||0);
        const isCascade=!_isDoneOp(e)&&!isNaN(ed.getTime())&&ed.getTime()>=base.getTime();
        if(e.id===ev.id||isCascade){const nd=new Date(ed);nd.setDate(nd.getDate()+DELTA);return {...e,date:nd.toISOString().slice(0,10),status:e.id===ev.id?'posticipato':e.status};}
        return e;
      });
      saveCalendarEvents(next);
      try{if(typeof queueOperationFeedback==='function')queueOperationFeedback({type:'modified',operation:ev,oldOperation:null,gardenData:prof,profile:prof,gdd:wx});}catch(e){}

    setDetail(null);setTick(t=>t+1);
  };
  const now=new Date();const curM=now.getMonth();const curWeek=_isoWeek(now);
  const months=[];for(let i=0;i<4;i++)months.push((curM+i)%12);
  const [selM,setSelM]=useState(curM);
  const dayLbl=(d)=>{const wd=d.toLocaleDateString('it-IT',{weekday:'short'}).replace('.','');return wd.charAt(0).toUpperCase()+wd.slice(1)+' '+d.getDate();};

  const opRow=(e,isCur,withBadge)=>{const ic=_opCat(e.cat);
    const _st=e._raw?opStatus(e._raw):null;

  </div>`;};
  const chev=html`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>`;

    ${view!=='guida'?html`<div class="seg2 fade"><div class=${'seg2t'+(view==='prog'?' on':'')} onClick=${()=>setView('prog')}>In programma</div><div class=${'seg2t'+(view==='diario'?' on':'')} onClick=${()=>setView('diario')}>Diario</div></div>`:''}

    ${(view==='prog'&&raw.length===0)?html`<div class="card fade" style="text-align:center;padding:26px 18px;">
      <div style="font-size:36px;line-height:1;">🌱</div>
      <div style="font-size:16px;font-weight:800;margin:10px 0 4px;">Nessuna operazione in programma</div>

        <div style="font-size:22px;line-height:1;">🔄</div>
        <div style="flex:1;min-width:0;"><div style="font-size:13.5px;font-weight:800;color:var(--ink);">Piano aggiornabile</div><div class="dt-note" style="margin:2px 0 0;">Sono passate 2 settimane: ricalibra in base a GDD e meteo, o fatti consigliare dal Dottor Verde.</div></div>

/* Gestione della scorta di un prodotto: aggiungere confezioni, consumare in FIFO, togliere.

function ScortaSheet({p,onClose}){
  const [qty,setQty]=useState('');
  const [msg,setMsg]=useState('');
  const closeX=html`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>`;
  if(!p)return '';
  const unit=p.unit||'conf';
  const have=(typeof whTotal==='function')?whTotal(p):Number(p.qty||0);
  const num=()=>{const v=parseFloat((qty||'').toString().replace(',','.'));return Number.isFinite(v)&&v>0?v:null;};
  const sync=()=>{try{window.dispatchEvent(new CustomEvent('lawnly:sync'));}catch(e){}};
  const aggiungi=()=>{
    const v=num();if(!v){setMsg('Scrivi quanto ne hai aggiunto.');return;}
    const size=Number(p.sizeEach)||v;
    const nPack=Math.max(1,Math.round(v/size));
    const packages=Array.from({length:nPack},(_,k)=>({id:Date.now()+k,size,unit,qty:size,remaining_qty:size,added_date:new Date().toISOString()}));
    try{S.set('dss_warehouse_v2',whAddPackages(whProducts(),{...p,packages,qty:size*nPack}));}catch(e){setMsg(e.message||'Non riesco ad aggiungere.');return;}
    sync();setQty('');setMsg(nPack===1?'Aggiunta una confezione.':('Aggiunte '+nPack+' confezioni.'));
  };
  const usa=()=>{
    const v=num();if(!v){setMsg('Scrivi quanto ne hai usato.');return;}
    let res;
    try{res=wfFifoUse(whProducts(),p.id,v,unit);}catch(e){setMsg(e.message||'Quantità non compatibile con le confezioni.');return;}
    const usato=Number(res&&res.used&&res.used.qty!=null?res.used.qty:res.used)||0;
    if(usato<=0){setMsg('In magazzino non c\'è abbastanza prodotto.');return;}
    S.set('dss_warehouse_v2',res.products);
    whLogUse(p.id,[p.brand,p.name].filter(Boolean).join(' '),unit,usato,'Consumo a mano',null);
    sync();setQty('');setMsg('Scalati '+usato+' '+unit+' dalla confezione più vecchia.');
  };
  const rimuovi=()=>{
    if(typeof window!=='undefined'&&!window.confirm('Togliere questo prodotto dal magazzino? Le giacenze registrate vanno perse.'))return;
    S.set('dss_warehouse_v2',whProducts().filter(x=>x&&x.id!==p.id));
    sync();onClose&&onClose();
  };
  return html`<${ModalPortal}><div class="rdz" style="position:fixed;inset:0;z-index:200;padding:0;min-height:0;display:block;gap:0">
    <div class="ov on" onClick=${onClose}></div>
    <div class="sheet on"><div class="sh-handle"></div>
      <div class="sh-head"><div class="sh-title">${[p.brand,p.name].filter(Boolean).join(' ')||'Prodotto'}</div><div class="sh-x" role="button" aria-label="Chiudi" onClick=${onClose}>${closeX}</div></div>
      <div class="sh-body">
        <div class="cen-grid"><div class="cen-field"><label>In magazzino</label><div class="cen-val">${Number.isFinite(have)?have:'—'} ${unit}</div></div>
          <div class="cen-field"><label>Confezione</label><div class="cen-val">${p.format||(p.sizeEach?(p.sizeEach+' '+unit):'—')}</div></div></div>
        <div class="cen-field"><label for="scorta-qty">Quantità (${unit})</label><input id="scorta-qty" class="cen-inp" type="text" inputmode="decimal" placeholder="0" value=${qty} onInput=${e=>{setQty(e.target.value);setMsg('');}}/></div>
        <div class="cen-actions"><button type="button" class="dt-goto" onClick=${aggiungi}>Aggiungi</button><button type="button" class="dt-goto" onClick=${usa}>Usa (dalla più vecchia)</button></div>
        ${msg?html`<p class="dt-note" role="status">${msg}</p>`:html`<p class="dt-note">Il consumo parte sempre dalla confezione aperta da più tempo. Le operazioni del piano scalano il magazzino da sole: questo serve per i consumi fuori piano.</p>`}
        <button type="button" class="dt-goto dt-ghost" onClick=${rimuovi}>Togli dal magazzino</button>
      </div>
    </div>
  </div></${ModalPortal}>`;
}

        </div>

}

function MisuraSuoloSheet({prof,onClose,setPg}){
  const zones=(prof&&prof.zones&&prof.zones.length)?prof.zones:[{id:'A',name:'Zona A'}];
  const [zona,setZona]=useState(zones[0].id||'A');
  const [ph,setPh]=useState('');const [um,setUm]=useState('');const [ts,setTs]=useState('');
  const [fert,setFert]=useState('Buona');const [ec,setEc]=useState('');
  const [dt,setDt]=useState(new Date().toISOString().slice(0,16));
  const [saved,setSaved]=useState(false);
  const soilData=S.get('dss_soil_data',[])||[];
  const zMeas=soilData.filter(d=>d.zona===zona);
  const avg=(k)=>{const v=zMeas.map(d=>d[k]).filter(x=>x!=null&&!isNaN(x));return v.length?(v.reduce((a,b)=>a+(+b),0)/v.length):null;};
  const aPh=avg('ph'),aUm=avg('um'),aTs=avg('ts');
  const zName=(zid)=>{const z=zones.find(x=>x.id===zid);return z?(z.name||('Zona '+z.id)):('Zona '+zid);};
  const save=()=>{
    const entry={id:Date.now(),dt,zona,ph:ph?parseFloat(ph.replace(',','.')):null,um:um?parseFloat(um.replace(',','.')):null,ts:ts?parseFloat(ts.replace(',','.')):null,ec:ec?parseFloat(ec.replace(',','.')):null,fert,note:''};
    try{if(typeof appendSoilMeasurementEntry==='function')appendSoilMeasurementEntry(entry);else{const d=S.get('dss_soil_data',[])||[];S.set('dss_soil_data',[entry,...d]);}}catch(e){}

    setSaved(true);setTimeout(()=>onClose&&onClose(),900);

  const closeX=html`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>`;

      <div class="sh-body">

        <div class="field"><label class="flab">Zona</label><div class="fchips">${zones.map(z=>html`<span key=${z.id} class=${'fchip'+(zona===z.id?' on':'')} onClick=${()=>setZona(z.id)}>${zName(z.id)}</span>`)}</div></div>
        ${zMeas.length?html`<div class="soil-media"><div class="soil-media-h">Media ${zName(zona)} · ${zMeas.length} misurazion${zMeas.length===1?'e':'i'}</div><div class="soil-media-v">${[aPh!=null&&('pH '+aPh.toFixed(1)),aUm!=null&&('Umidità '+Math.round(aUm)+'%'),aTs!=null&&('Temp '+aTs.toFixed(1)+'°')].filter(Boolean).join(' · ')||'—'}</div></div>`:''}
        <div class="frow"><div class="field"><label class="flab">pH</label><input class="finput" type="text" inputmode="decimal" placeholder="6.8" value=${ph} onInput=${e=>setPh(e.target.value)}/></div><div class="field"><label class="flab">Umidità %</label><input class="finput" type="text" inputmode="decimal" placeholder="28" value=${um} onInput=${e=>setUm(e.target.value)}/></div></div>
        <div class="frow"><div class="field"><label class="flab">Temperatura °C</label><input class="finput" type="text" inputmode="decimal" placeholder="26.9" value=${ts} onInput=${e=>setTs(e.target.value)}/></div><div class="field"><label class="flab">Fertilità</label><div class="fsel"><select class="fselect" value=${fert} onChange=${e=>setFert(e.target.value)}><option>Buona</option><option>Media</option><option>Scarsa</option></select></div></div></div>

/* ===== contatore numerico easeOutQuart (come plus) ===== */
function Num({end,dur,dec}){
  const ref=useRef(null);
  useEffect(()=>{
    const target=parseFloat((''+end).replace(',','.'));
    if(isNaN(target)){if(ref.current)ref.current.textContent=end;return;}
    const D=dur||1000;let t0=null,raf;
    const fmt=(v)=>dec?v.toFixed(dec).replace('.',','):(''+Math.round(v));
    const tick=(t)=>{if(t0==null)t0=t;const p=Math.min(1,(t-t0)/D);const e=1-Math.pow(1-p,4);if(ref.current)ref.current.textContent=fmt(target*e);if(p<1)raf=requestAnimationFrame(tick);};
    raf=requestAnimationFrame(tick);
    return ()=>{if(raf)cancelAnimationFrame(raf);};
  },[end]);
  const t=parseFloat((''+end).replace(',','.'));
  return html`<span ref=${ref}>${isNaN(t)?end:(dec?(0).toFixed(dec):'0')}</span>`;
}

function computeWaterStress(vwcDisplayed) {
  if (vwcDisplayed == null) return { score: 0, label: 'N/D', color: 'gray' };
  if (vwcDisplayed >= 35) return { score: 0, label: 'Nullo', color: 'green' };
  if (vwcDisplayed >= 28) return { score: 2, label: 'Basso', color: 'green' };
  if (vwcDisplayed >= 22) return { score: 4, label: 'Moderato', color: 'yellow' };
  if (vwcDisplayed >= 15) return { score: 7, label: 'Alto', color: 'orange' };
  return { score: 10, label: 'Critico', color: 'red' };
}

function computeIndicators({wxData,gardenData,soilData,waterBalance,gddInfo}){
  // Helpers
  const clamp=(v,min=0,max=10)=>Math.max(min,Math.min(max,v));
  const colorize=(v)=>v<=3?'green':(v<=6?'amber':'red');
  const labelize=(v)=>v<=2?'Nullo':v<=4?'Basso':v<=6?'Moderato':v<=8?'Alto':'Critico';

  // 1. Rischio fungino
  const rhMean=wxData?.humidity?.mean??60;
  const tNight=wxData?.tempNight??15;
  const dew=wxData?.dewPoint??0;
  const rain3d=wxData?.rain3d??0;
  let fungal=0;
  if(rhMean>80)fungal+=3; else if(rhMean>70)fungal+=2;
  if(tNight>=15&&tNight<=22)fungal+=3;
  if(dew>10)fungal+=2;
  if(rain3d>15)fungal+=2;
  fungal=clamp(fungal);

  // 2. Rischio malattie (brown patch, dollar spot)
  const tDay=wxData?.tempDay??20;
  let disease=0;
  if(tDay>=22&&tDay<=30&&rhMean>70)disease+=4;
  if(rain3d>10&&rhMean>75)disease+=3;
  if((gddInfo?.stress?.heat??0)>3)disease+=2;
  disease=clamp(disease);

  // 3. Rischio larve/insetti
  const tSoil=soilData?.ts ?? soilData?.ultimaMisurazione?.temperatura ?? (wxData?.tempSoil ?? tDay);
  const season=gddInfo?.markerPct??0;
  let larvae=0;
  if(tSoil>=18&&tSoil<=28)larvae+=3;
  if(season>=30&&season<=70)larvae+=2;
  const soilMoist=soilData?.um ?? soilData?.ultimaMisurazione?.umidita ?? 50;
  if(soilMoist>=40&&soilMoist<=70)larvae+=2;
  larvae=clamp(larvae);

  // 4. Stress idrico — PATCH 06a: VWC display finale (con offset stagionale)
  const wsVwc = computeWaterStress(waterBalance?.vwcDisplayed);
  const waterStressVal = clamp(wsVwc.score);
  const wsPackColor = wsVwc.color === 'gray' || wsVwc.color === 'green' ? 'green'
    : wsVwc.color === 'yellow' ? 'amber'
    : 'red';

  // 5. Stress termico (da gddInfo)
  const heatStress=gddInfo?.stress?.heat??0;
  const coldStress=gddInfo?.stress?.cold??0;
  const thermalStress=clamp(Math.max(heatStress,coldStress));

  // 6. Fusarium (freddo + umido + neve/scioglimento)
  let fusarium=0;
  if(tNight<5&&rhMean>85)fusarium+=4;
  if(tNight>=0&&tNight<=8&&rain3d>5)fusarium+=3;
  if(wxData?.snow3d&&wxData.snow3d>0)fusarium+=3;
  fusarium=clamp(fusarium);

  const pack=(v)=>({value:v,label:labelize(v),color:colorize(v)});

  return{
    fungal:pack(fungal),
    disease:pack(disease),
    larvae:pack(larvae),
    waterStress:{value:waterStressVal,label:wsVwc.label,color:wsPackColor},
    thermalStress:pack(thermalStress),
    fusarium:pack(fusarium)
  };
}

function getDiagnosisLabel(score) {
  const s = Math.max(0, Math.min(100, score || 0));
  if (s < 30)  return { label: 'Stato critico',   color: 'red',     icon: '🚨' };
  if (s < 50)  return { label: 'Sotto la media',  color: 'orange',  icon: '⚠️' };

  if (s < 85)  return { label: 'Buono',           color: 'green',   icon: '✅' };
  return        { label: 'Ottimo',          color: 'emerald', icon: '🌟' };
}

   WATER ENGINE — Single source fabbisogno idrico giornaliero
   ═════════════════════════════════════════════════════════════ */
const WaterEngine=(function(){
  function kexpForExposure(exp, lat, dayOfYear){
    /* PATCH v8.1 — Sun Engine: kexp geografico via kexpGeographic(exp, lat, dayOfYear).
       Quando lat è disponibile: ETc modula su altezza solare reale (Galliera maggio 0.92,
       Stoccolma maggio 0.77, Singapore 0.97, Marrakech luglio 0.97).
       Fallback statico (PATCH v7.5) quando lat null: enum sun/semi/partial/shade. */
    if (lat != null && dayOfYear != null) {
      return kexpGeographic(exp, lat, dayOfYear);
    }
    const e=(exp||'').toLowerCase();
    if(e==='sun'||e.includes('pieno'))return 1.2;
    if(e==='shade'||(e.includes('ombra')&&!e.includes('semi')&&!e.includes('mezz')))return 0.7;
    if(e==='partial'||e.includes('mezz'))return 0.85;
    if(e==='semi'||e.includes('semi')||e.includes('parziale'))return 0.95;
    return 1.0;
  }
  /** Hargreaves–Samani ETo mm/giorno (Ra MJ/m²/d come calcolo legacy Dashboard) */
  function computeHargreavesSamaniEtoMm(tmax,tmin,latDeg){
    const Tmax=parseFloat(tmax),Tmin=parseFloat(tmin);
    if(!Number.isFinite(Tmax)||!Number.isFinite(Tmin)||Tmax<=Tmin)return 0;
    const Tmean=(Tmax+Tmin)/2;
    const TD=Math.max(0.1,Tmax-Tmin);
    const phi=(parseFloat(latDeg)||45)*Math.PI/180;
    const now=new Date();
    const J=Math.ceil((now-new Date(now.getFullYear(),0,1))/864e5)+1;
    const dr=1+0.033*Math.cos(2*Math.PI*J/365);
    const decl=0.409*Math.sin(2*Math.PI*J/365-1.39);
    const cosWs=-Math.tan(phi)*Math.tan(decl);
    const ws=Math.abs(cosWs)<=1?Math.acos(cosWs):cosWs>0?0:Math.PI;
    const Ra_MJ=(24*60/Math.PI)*0.0820*dr*(ws*Math.sin(phi)*Math.sin(decl)+Math.cos(phi)*Math.cos(decl)*Math.sin(ws));
    const Ra_mm=Ra_MJ/2.45;
    return Math.max(0,parseFloat((0.0023*Ra_mm*(Tmean+17.8)*Math.sqrt(TD)).toFixed(3)));
  }
  function resolveFlowLpm(gardenData){
    const g=gardenData||{};
    const v=parseFloat(g.flowRateLpm??g.irrigationSetup?.flowRateLpm??g.profile?.flowRateLpm??g.profile?.flowRate);
    return Number.isFinite(v)&&v>0?v:10;
  }
  function resolveZonesSumArea(gardenData){
    let raw=Array.isArray(gardenData?.zones)&&gardenData.zones.length?gardenData.zones:[];
    const total=Math.max(0,parseFloat(gardenData?.totalArea)||0);
    if(!raw.length){
      const a=total||100;
      return{ zones:[{id:'A',name:'Giardino',area:a,exposure:''}], sumArea:a };
    }
    let sum=raw.reduce((s,z)=>s+Math.max(0,parseFloat(z.area_m2??z.area)||0),0);
    if(sum<=0&&total>0){
      const each=total/raw.length;
      raw=raw.map(z=>({...z,area:each}));
      sum=total;
    }
    if(sum<=0){
      sum=total||100;
      raw=[{id:'A',name:'Giardino',area:sum,exposure:''}];
    }
    return{ zones:raw, sumArea:sum };
  }
  /**
   * @param {object} gardenData profilo giardino (zones.area o area_m2, totalArea, lat, …)
   * @param {{temp_max,temp_min,rh?,rain_24h,rain_forecast_24h}} weather
   */
  function computeDailyNeed(gardenData,weather){
    const w=weather||{};
    const lat=parseFloat(gardenData?.lat??gardenData?.location?.lat) || 45;
    const rain24=Math.max(0,parseFloat(w.rain_24h)||0);
    const rainFc=Math.max(0,parseFloat(w.rain_forecast_24h)||0);
    const etoFromOpenMeteo=Number.isFinite(parseFloat(w.et0))&&parseFloat(w.et0)>0?parseFloat(w.et0):null;
    const etoMm=etoFromOpenMeteo!=null?etoFromOpenMeteo:computeHargreavesSamaniEtoMm(w.temp_max,w.temp_min,lat);
    const etoSource=etoFromOpenMeteo!=null?'open-meteo-pm':'hargreaves-samani-fallback';
    const netRaw=etoMm-rain24-rainFc*0.7;
    const netDeficitMm=Math.max(0,parseFloat(netRaw.toFixed(2)));
    const flowLpm=resolveFlowLpm(gardenData);
    const {zones,sumArea}=resolveZonesSumArea(gardenData);
    const simpleLitersTotal=Math.round(netDeficitMm*sumArea);
    const perZone=zones.map(z=>{
      const area=Math.max(0,parseFloat(z.area_m2??z.area)||0);
      /* PATCH v8.1 — passa lat + dayOfYear per kexp geografico (Sun Engine) */
      const _profLatKx = parseFloat(gardenData?.lat);
      const _doyKx = Math.ceil((new Date()-new Date(new Date().getFullYear(),0,1))/86400000);
      const kexp=kexpForExposure(z.exposure, isFinite(_profLatKx)?_profLatKx:null, _doyKx);
      const mmAp=parseFloat((netDeficitMm*kexp).toFixed(2));
      const liters=Math.round(mmAp*(area||0));
      const minutesAtFlowRate=liters>0&&flowLpm>0?Math.max(1,Math.round(liters/flowLpm)):0;
      return{
        zoneId:z.id,name:z.name||z.id,area_m2:area||0,exposure:z.exposure||'',kexp,
        mmApplied:mmAp,liters,minutesAtFlowRate
      };
    });
    const totalLiters=perZone.reduce((s,p)=>s+(p.liters||0),0)||simpleLitersTotal;
    const needMmWeighted=sumArea>0?parseFloat((totalLiters/Math.max(sumArea,1)).toFixed(2)):parseFloat(netDeficitMm.toFixed(2));
    let recommendation='irrigare';
    if(netDeficitMm<0.5)recommendation='saltare';
    else if(netDeficitMm<=2)recommendation='ridurre';
    const reasoning=`ET₀ ${parseFloat(etoMm.toFixed(1))} mm · Netto ${parseFloat(netDeficitMm.toFixed(1))} mm · ${totalLiters} L`;
    return{
      etoMm:parseFloat(etoMm.toFixed(2)),
      etoSource,
      netDeficitMm:parseFloat(netDeficitMm.toFixed(2)),
      rain24h:parseFloat(rain24.toFixed(2)),
      rainForecast24h:parseFloat(rainFc.toFixed(2)),
      totalLiters,simpleLiters:simpleLitersTotal,sumAreaM2:sumArea,
      needMmWeighted,
      recommendation,reasoning,rh:w.rh??null,
      flowRateLpm:flowLpm,
      perZone
    };
  }
  /** Meteo Lawnly wx → ingresso WeatherEngine */
  function buildWaterWeatherFromWx(wxData){
    const t=wxData?.todayData||{};
    const f7=wxData?.forecast7||[];
    // forecast7 parte da 2 giorni fa (past_days=2): l'indice 1 e' IERI, non domani.
    // Stessa classe di bug del rischio fungino: si cerca per data locale, non per posizione.
    const _oggiStr=new Date().toLocaleDateString('sv-SE');
    const _iOggi=f7.findIndex(d=>String(d?.date||'').startsWith(_oggiStr));
    const _domani=_iOggi>=0?f7[_iOggi+1]:null;
    const rainTomorrow=parseFloat(_domani?.precipitation_sum??_domani?.rain??0)||0;
    const et0FromOpenMeteo=t.et0!=null?parseFloat(t.et0):null;
    return{
      temp_max:parseFloat(t.tmax),
      temp_min:parseFloat(t.tmin),
      rh:t.humidity!=null?parseFloat(t.humidity):null,
      rain_24h:parseFloat(t.rain??0)||0,
      rain_forecast_24h:rainTomorrow,
      et0:Number.isFinite(et0FromOpenMeteo)&&et0FromOpenMeteo>0?et0FromOpenMeteo:null
    };
  }
  return{ computeDailyNeed, buildWaterWeatherFromWx, computeHargreavesSamaniEtoMm, kexpForExposure };
})();
const computeDailyNeed=WaterEngine.computeDailyNeed;
const buildWaterWeatherFromWx=WaterEngine.buildWaterWeatherFromWx;

function opCategory(op){
  if(op.category==='mechanical'||op.category==='chemical'||op.category==='other')return op.category;
  if(op.category==='meccanica'||op.type==='meccanico'||op.type==='mechanic')return'mechanical';
  const c=(op.category||'').toString().toLowerCase();
  if(c==='meccanica'||c==='mechanic')return'mechanical';
  if(c==='concimazione'||c==='biostimolazione'||c==='difesa'||c==='fertilization')return'chemical';
  if(op.category)return'chemical';
  const mechKeywords=['taglio','arieggiatura','arieggiare','top dressing','risemina','carotatura','rullatura','verticut','sabbia','foratura','topdressing','overseed'];
  const chemKeywords=['fertilizz','concimaz','diserbo','fungicid','insetticid','antimusco','bio-stim','biostim','irrigaz'];
  const name=(op.name||'').toLowerCase();
  if(mechKeywords.some(k=>name.includes(k)))return'mechanical';
  if(chemKeywords.some(k=>name.includes(k)))return'chemical';
  return'other';
}

function NewOperationModal({isOpen,initialOp,zones,warehouse,catalog,onSave,onClose,grassType,audienceLevel}){
  const _allZoneIds=(zones||[]).map(z=>z.id||z.name);
  const [formData,setFormData]=useState(()=>initialOp||{
    date:new Date().toISOString().split('T')[0],
    category:'concimazione',
    type:'',
    name:'',
    zones:_allZoneIds, // tutte selezionate di default, l'utente può deselezionare
    productId:null,
    formatSku:null,
    doseGm2:0,
    notes:''
  });
  const [productListMode,setProductListMode]=useState('warehouse');
  const [productSearch,setProductSearch]=useState('');
  const handleChange=(field,value)=>setFormData(prev=>({...prev,[field]:value}));

  const warehouseProducts=(warehouse||[])
    .filter(w=>Array.isArray(w.packages)&&w.packages.some(pk=>(pk.remaining_qty||0)>0))
    .map(w=>({id:w.id,name:w.name,brand:w.brand||'',source:'warehouse'}));

  const matchedCatalog=formData.category&&formData.category!=='meccanica'&&formData.category!=='irrigazione'
    ?(window.__LAWNLY_MATCH__
      ?(()=>{try{const r=window.__LAWNLY_MATCH__({category:formData.category,type:formData.type,month:new Date(formData.date).getMonth()+1},catalog,warehouse);return(r?.alternatives||(r?.primary?[r.primary]:[]))||[];}catch(e){console.warn('[Lawnly] match fn error',e);return[];}})()
      :[]
    ).slice(0,8):[];

  const allCatalog=(catalog||[])
    .filter(p=>audienceAllowed(p.audienceLevel,audienceLevel))
    .filter(p=>!productSearch||(`${p.name} ${p.brand||''}`).toLowerCase().includes(productSearch.toLowerCase()));

  const displayedProducts=productListMode==='warehouse'
    ?warehouseProducts
    :productListMode==='catalog'
      ?matchedCatalog.map(p=>({id:p.id,name:p.name,brand:p.brand,source:'catalog'}))
      :allCatalog.map(p=>({id:p.id,name:p.name,brand:p.brand,source:'catalog'}));

  useEffect(()=>{
    if(!formData.productId)return;
    const p=(catalog||[]).find(c=>c.id===formData.productId);
    if(p?.dose?.min&&!formData.doseGm2){
      setFormData(prev=>({...prev,doseGm2:p.dose.min}));
    }
  },[formData.productId]);

  const zoneAreaSum=formData.zones.reduce((s,id)=>{
    const z=(zones||[]).find(x=>(x.id||x.name)===id);
    return s+(parseFloat(z?.area)||0);
  },0);
  const quantityTotal=formData.doseGm2>0?fromBase(toBase(formData.doseGm2*zoneAreaSum,'g'),'kg'):0;

  const submit=()=>{
    if(!formData.name.trim())return;
    const d=formData.date?new Date(formData.date):new Date();
    const valid=!isNaN(d);
    onSave({
      ...formData,
      id:initialOp?.id||('user_'+Date.now()),
      month:valid?d.getMonth()+1:1,
      week:valid?Math.ceil(((d-new Date(d.getFullYear(),0,1))/86400000+1)/7):1,
      suggestedProductId:initialOp?.suggestedProductId||null,
      finalProductId:formData.productId||null,
      finalFormatSku:formData.formatSku||null,
      quantityTotal:quantityTotal,
      unit:'kg',
      status:initialOp?.status||'planned',
      source:initialOp?.id?'user_edited':'user_added'
    });
  };

  if(!isOpen)return null;

  const isWarehouseProd=formData.productId&&warehouseProducts.some(w=>w.id===formData.productId);
  const showProductSection=formData.category!=='meccanica'&&formData.category!=='irrigazione';

  const modalVDom = html`<div class="modal-backdrop" onClick=${onClose} style="position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:9999;padding:1rem;overflow-y:auto">
    <div onClick=${e=>e.stopPropagation()} style="background:#fff;border-radius:14px;max-width:560px;width:100%;max-height:92vh;overflow-y:auto;padding:20px;box-shadow:0 20px 50px rgba(0,0,0,.3)">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
        <div style="font-size:16px;font-weight:700">${initialOp?'✏️ Modifica operazione':'➕ Nuova operazione'}</div>
        <button onClick=${()=>onClose()} style="background:none;border:0;font-size:22px;cursor:pointer;color:var(--muted);line-height:1">✕</button>
      </div>

      <!-- CATEGORIA -->
      <div style="margin-bottom:12px">
        <label style="font-size:11px;color:var(--muted);display:block;margin-bottom:4px">Categoria</label>
        <div style="display:flex;gap:6px;flex-wrap:wrap">
          ${['concimazione','biostimolazione','difesa','irrigazione','meccanica'].map(cat=>html`
            <button type="button" key=${cat} class=${'btn btn-s'+(formData.category===cat?' btn-p':'')} onClick=${()=>handleChange('category',cat)} style="font-size:11px;padding:5px 10px">${cat}</button>
          `)}
        </div>
      </div>

      <!-- NOME + DATA -->
      <div class="grid-2" style="margin-bottom:12px;gap:8px">
        <div>
          <label style="font-size:11px;color:var(--muted);display:block;margin-bottom:4px">Nome *</label>
          <input class="inp" value=${formData.name} onInput=${e=>handleChange('name',e.target.value)} placeholder="es. Concimazione marzo"/>
        </div>
        <div>
          <label style="font-size:11px;color:var(--muted);display:block;margin-bottom:4px">Data</label>
          <input class="inp" type="date" value=${formData.date} onInput=${e=>handleChange('date',e.target.value)}/>
        </div>
      </div>

      <!-- ZONE -->
      ${(zones||[]).length?html`<div style="margin-bottom:12px">
        <label style="font-size:11px;color:var(--muted);display:block;margin-bottom:6px">Zone <span style="font-weight:400">(seleziona dove applicare)</span></label>
        <div style="display:flex;gap:6px;flex-wrap:wrap">
          ${(()=>{
            const allIds=(zones||[]).map(z=>z.id||z.name);
            const allSel=allIds.length>0&&allIds.every(id=>formData.zones.includes(id));
            const noneSel=formData.zones.length===0;
            return [
              html`<button type="button" key="__tutto"
                class=${'btn btn-s'+(allSel?' btn-p':'')}
                onClick=${()=>handleChange('zones',[...allIds])}
                style="font-size:11px;padding:5px 12px;font-weight:600">${allSel?'✓ ':''} Tutto</button>`,
              ...zones.map(z=>{
                const zid=z.id||z.name;
                const sel=formData.zones.includes(zid);
                return html`<button type="button" key=${zid}
                  class=${'btn btn-s'+(sel?' btn-p':'')}
                  onClick=${()=>handleChange('zones',sel?formData.zones.filter(x=>x!==zid):[...formData.zones,zid])}
                  style="font-size:11px;padding:5px 10px">
                  ${sel?'✓ ':''}${z.name||zid}${z.area?' ('+z.area+'m²)':''}
                </button>`;
              })
            ];
          })()}
        </div>
        ${formData.zones.length===0?html`<div style="font-size:10px;color:#ef4444;margin-top:4px">⚠ Seleziona almeno una zona</div>`:''}
      </div>`:''}

      ${showProductSection?html`
        <!-- PRODOTTO -->
        <div style="margin-bottom:12px">
          <label style="font-size:11px;color:var(--muted);display:block;margin-bottom:4px">Prodotto</label>
          <div style="display:flex;gap:4px;margin-bottom:6px;flex-wrap:wrap">
            <button class=${'btn btn-s'+(productListMode==='warehouse'?' btn-p':'')} onClick=${()=>setProductListMode('warehouse')} style="font-size:10px;padding:4px 8px">In magazzino (${warehouseProducts.length})</button>
            <button class=${'btn btn-s'+(productListMode==='catalog'?' btn-p':'')} onClick=${()=>setProductListMode('catalog')} style="font-size:10px;padding:4px 8px">Consigliati (${matchedCatalog.length})</button>
            <button class=${'btn btn-s'+(productListMode==='all'?' btn-p':'')} onClick=${()=>setProductListMode('all')} style="font-size:10px;padding:4px 8px">Tutti</button>
          </div>
          ${productListMode==='all'?html`<input class="inp" placeholder="Cerca prodotto (nome o marca)..." value=${productSearch} onInput=${e=>setProductSearch(e.target.value)} style="margin-bottom:6px;font-size:12px"/>`:''}
          <select class="inp" value=${formData.productId||''} onChange=${e=>handleChange('productId',e.target.value||null)}>
            <option value="">— Seleziona prodotto —</option>
            ${displayedProducts.slice(0,80).map(p=>html`<option key=${p.id} value=${p.id}>${p.brand?p.brand+' — ':''}${p.name}${p.source==='warehouse'?' ✓ (magazzino)':''}</option>`)}
          </select>
          ${displayedProducts.length===0?html`<div style="font-size:11px;color:var(--muted);margin-top:6px;font-style:italic">${productListMode==='warehouse'?'Nessun prodotto in magazzino con scorta disponibile.':productListMode==='catalog'?'Nessun suggerimento per questa categoria.':'Nessun risultato.'}</div>`:''}
          ${formData.productId&&!isWarehouseProd?html`<div style="background:#FEF3C7;border:1px solid rgba(245,158,11,.3);border-radius:.6rem;padding:8px 10px;margin-top:6px;font-size:11px;color:#92400E;line-height:1.5">
            ⚠ Questo prodotto non è in magazzino.
            <button class="btn btn-s" style="margin-top:6px;font-size:10px;padding:4px 10px;display:block" onClick=${()=>onClose('openAddProduct:'+formData.productId)}>+ Aggiungi al magazzino</button>
          </div>`:''}
        </div>

        <!-- DOSE + QTY -->
        <div class="grid-2" style="margin-bottom:12px;gap:8px">
          <div>
            <label style="font-size:11px;color:var(--muted);display:block;margin-bottom:4px">Dose g/m²</label>
            <input class="inp" type="number" step="0.1" min="0" value=${formData.doseGm2} onInput=${e=>handleChange('doseGm2',parseFloat(e.target.value)||0)}/>
          </div>
          <div>
            <label style="font-size:11px;color:var(--muted);display:block;margin-bottom:4px">Qty totale (kg)</label>
            <input class="inp" value=${quantityTotal.toFixed(2)} readOnly style="background:#F9FAFB;color:var(--muted)"/>
          </div>
        </div>
      `:''}

      <!-- NOTE -->
      <div style="margin-bottom:14px">
        <label style="font-size:11px;color:var(--muted);display:block;margin-bottom:4px">Note</label>
        <textarea class="inp" rows="2" value=${formData.notes} onInput=${e=>handleChange('notes',e.target.value)} placeholder="Istruzioni, osservazioni…"></textarea>
      </div>

      <div style="display:flex;gap:8px">
        <button type="button" class="btn btn-s" style="flex:1;padding:10px" onClick=${()=>onClose()}>Annulla</button>
        <button type="button" class="btn btn-p" style="flex:2;padding:10px" onClick=${submit} disabled=${!formData.name.trim()||formData.zones.length===0}>💾 Salva operazione</button>
      </div>
    </div>
  </div>`;
  return createPortal ? createPortal(modalVDom, document.body) : modalVDom;
}

const IRRIG_FLOW_LMIN=8;

function patchController(change){

// Differenza tra date civili locali: non dividere millisecondi locali nei giorni DST.
function diffGiorniLocali(anchor,day){
  const [y,m,d]=anchor.split('-').map(Number);
  return (Date.UTC(day.getFullYear(),day.getMonth(),day.getDate())-Date.UTC(y,m-1,d))/864e5;
}
function controllerProgramOnDay(program,day){
  const repeat=program.repeat??'days';
  if(repeat==='days')return !!program.days?.includes(day.getDay());
  const n=repeat==='every2'?2:repeat==='every3'?3:0;
  const diff=diffGiorniLocali(program.anchor??new Date().toLocaleDateString('sv-SE'),day);
  return !!n&&diff>=0&&diff%n===0;
}
function controllerOccurrences(program,from,to){
  if((program.repeat??'days')==='days'&&!Array.isArray(program.days))return [];
  if(!program.zones?.length||!/^([01]\d|2[0-3]):[0-5]\d$/.test(program.time)||!(Number(program.minutes)>0))return [];
  const [hour,minute]=program.time.split(':').map(Number), occurrences=[];
  const day=new Date(from);day.setHours(0,0,0,0);
  for(;day<=to;day.setDate(day.getDate()+1)){
    if(!controllerProgramOnDay(program,day))continue;
    const at=new Date(day);at.setHours(hour,minute,0,0);
    if(at>from&&at<=to)occurrences.push({program,at});
  }
  return occurrences;
}
function controllerWeekEnd(now){const end=new Date(now);end.setDate(end.getDate()+7);return end;}
function nextControllerRun(ctrl,now=new Date()){
  if(!ctrl.on)return null;
  return (ctrl.programs||[]).slice(0,8).flatMap(p=>controllerOccurrences(p,now,controllerWeekEnd(now))).sort((a,b)=>a.at-b.at)[0]||null;
}
function controllerSummary(programs,flow=IRRIG_FLOW_LMIN,now=new Date()){
  let cyclesPerWeek=0,litersPerWeek=0;
  for(const program of programs.slice(0,8)){
    const cycles=controllerOccurrences(program,now,controllerWeekEnd(now)).length;
    cyclesPerWeek+=cycles;
    litersPerWeek+=cycles*Number(program.minutes)*flow*new Set(program.zones||[]).size;
  }
  // Un ciclo è l'esecuzione di un programma; con durate diverse mostriamo la media.
  return {litersPerCycle:cyclesPerWeek?litersPerWeek/cyclesPerWeek:0,cyclesPerWeek,litersPerWeek};
}

/* Centralina virtuale: nessun comando hardware; recupero locale degli ultimi 7 giorni. */
function runControllerCatchup(){
  const prof=S.get('dss_profile',{})||{}, ctrl=prof.controller;
  const now=new Date(), cutoff=now.getTime()-7*864e5;
  const result={registered:0,skipped:0};
  if(!ctrl?.on||!ctrl.programs?.length)return result;
  const wx=window.__LAWNLY_WX__;
  // All'avvio attendi il meteo: il caricamento richiama il recupero.
  if(!wx?.forecast7?.length)return {...result,pending:true};
  const last=Date.parse(ctrl.lastRun), start=Math.max(Number.isFinite(last)?last:cutoff,cutoff);
  if(start>=now.getTime())return result;
  const runs=(ctrl.runs||[]).filter(r=>Date.parse(r.timestamp)>=cutoff);
  const hist=S.get('dss_irrigation_history',[])||[];
  const seen=new Set([...runs,...hist.filter(h=>h?.auto)].map(r=>r.programId+'|'+r.timestamp));
  const occurrences=[];
  for(const program of ctrl.programs.slice(0,8)){
    if(!program.id)continue;
    occurrences.push(...controllerOccurrences(program,new Date(start),now));
  }
  occurrences.sort((a,b)=>a.at-b.at);
  for(const {program,at} of occurrences){
    const timestamp=at.toISOString(), key=program.id+'|'+timestamp;
    if(seen.has(key))continue;
    const day=at.toLocaleDateString('sv-SE');
    // forecast7 copre solo 2 giorni passati: piu' indietro la pioggia sta in wx.history,
    // altrimenti un giorno piovoso di 4 giorni fa risulterebbe a 0 mm e verrebbe registrato.
    const weather=wx.forecast7.find(d=>d.date===day)
      ||(wx.history||[]).find(d=>String(d?.date||'').startsWith(day));
    const rain=Number(weather?.precipitation??weather?.rain??0);
    const forced=(ctrl.forceRuns||[]).some(r=>r.programId===program.id&&r.timestamp===timestamp);
    if(!forced&&rain>=Number(ctrl.rainSkipMm??5)){
      runs.push({programId:program.id,timestamp,status:'skipped',rainMm:rain});result.skipped++;
    }else{
      const minutes=Number(program.minutes), flow=prof.flowRateLpm??IRRIG_FLOW_LMIN;
      const zonesDetail=[...new Set(program.zones)].map(id=>({id,name:(prof.zones||[]).find(z=>z.id===id)?.name||('Zona '+id),minutes,minutesAtFlowRate:minutes,liters:minutes*flow}));
      appendIrrigationHistoryEntry({zonesDetail,et:weather?.et0??null,note:'Centralina · '+program.name,timestamp,auto:true,programId:program.id});
      runs.push({programId:program.id,timestamp,status:'registered'});result.registered++;
    }
    seen.add(key);
  }
  // Gli eventi emessi dall'helper possono aver aggiornato altri campi del profilo.
  const fresh=S.get('dss_profile',{})||{};
  if(fresh.controller){
    const merged=new Map([...(fresh.controller.runs||[]),...runs].filter(r=>Date.parse(r.timestamp)>=cutoff).map(r=>[r.programId+'|'+r.timestamp,r]));
    S.set('dss_profile',{...fresh,controller:{...fresh.controller,lastRun:now.toISOString(),runs:[...merged.values()],forceRuns:(fresh.controller.forceRuns||[]).filter(r=>Date.parse(r.timestamp)>now.getTime())}});
    window.dispatchEvent(new CustomEvent('lawnly:sync'));
  }
  if(result.registered&&typeof showGlobalToast==='function')showGlobalToast(result.registered+' '+(result.registered===1?'irrigazione registrata':'irrigazioni registrate')+' dalla centralina','success',6000);
  return result;
}

/* PATCH v8.0 — Enrich foto onboarding con AI vision retroattivo.
   Scansiona dss_zone_photos, identifica foto con source='onboarding-step7' senza aiAnalysis,
   le analizza con runLawnZonePhotoAI e salva. Ritorna mappa {zoneId: [analyses]} per uso
   downstream (generateIntegratedDiagnosis). */
async function enrichOnboardingPhotosWithAI(){
  try{
    const all = S.get('dss_zone_photos', {}) || {};
    const analyses = {};
    let touched = false;
    for (const zoneId of Object.keys(all)) {
      const zList = all[zoneId] || [];
      for (let i = 0; i < zList.length; i++) {
        const p = zList[i];
        if (!p || (!p.b64&&!p.remoteId)) continue;
        if (p.source !== 'onboarding-step7') continue;
        if (p.aiAnalysis) {
          analyses[zoneId] = [...(analyses[zoneId]||[]), p.aiAnalysis];
          continue;
        }
        const photoData=await readZonePhoto(p);
        const profData=S.get('dss_profile',{})||{};
        const zoneData=(profData.zones||[]).find(z=>z.id===zoneId)||{};
        const zCtx={name:zoneData.name,exposure:zoneData.exposure,area:zoneData.area,grassType:profData.grassMixture};
        try{
          const a = await runLawnZonePhotoAI(photoData, p.mediaType||'image/jpeg', zCtx);
          zList[i] = {...p, aiAnalysis: a};
          analyses[zoneId] = [...(analyses[zoneId]||[]), a];
          touched = true;
          console.log('[Lawnly v8.0] enriched onboarding photo zoneId='+zoneId+' score='+a.score);
        }catch(e){
          console.warn('[Lawnly v8.0] vision failed for', zoneId, e.message);
        }
      }
      all[zoneId] = zList;
    }
    if(touched){
      const current=S.get('dss_zone_photos',{})||{};
      for(const [zid,list] of Object.entries(current))current[zid]=list.map(p=>{const a=(all[zid]||[]).find(q=>q.id===p.id)?.aiAnalysis;return a?{...p,aiAnalysis:a}:p;});
      persistZonePhotoMetadata(current);
    }
    return analyses;
  }catch(e){ console.warn('[Lawnly v8.0] enrichOnboardingPhotosWithAI failed:', e.message); return {}; }
}

ANALISI VISION FOTO (AI):
${photoSummaries.length?photoSummaries.join('\n'):'Nessuna foto del prato caricata in onboarding.'}

CONTESTO AGRONOMICO:
- Specie: ${profile?.grassMixture||profile?.grassType||'microterme'}

Rispondi SOLO con JSON valido (nessun testo fuori):
{"stato_generale":"descrizione 2-3 frasi SPECIFICHE del prato di questo utente (no frasi generiche), che integra i problemi indicati e cosa vedi nelle foto","problemi":["max 4 problemi prioritari con linguaggio user-friendly italiano"],"operazione_top":"l'azione concreta più urgente da fare nei prossimi 3-7 giorni","operazione_top_nota":"una frase di motivazione tecnica (perché)","salute_score_aggregato":${avgScore!=null?avgScore:'null'}}`;

    const m = raw && raw.match(/\{[\s\S]*\}/);
    if (m) {
      const parsed = JSON.parse(m[0]);
      return {
        stato_generale: parsed.stato_generale || null,
        problemi: Array.isArray(parsed.problemi) ? parsed.problemi.slice(0,4) : null,

        salute_score: typeof parsed.salute_score_aggregato==='number' ? parsed.salute_score_aggregato : avgScore,
        generatedAt: new Date().toISOString(),
        photoCount: photoSummaries.length
      };
    }
  }catch(e){ console.warn('[Lawnly v8.0] generateIntegratedDiagnosis failed:', e.message); }
  return null;
}

// Quantità conservate nell'unità di ingresso; aritmetica solo in g / ml / conf.
function toBase(qty,unit){
  const u=String(unit||'').trim().toLowerCase();
  const units={g:['g',1],kg:['g',1000],ml:['ml',1],l:['ml',1000],conf:['conf',1]};
  const spec=units[u],n=Number(String(qty).replace(',','.'));
  if(!spec||!Number.isFinite(n)||n<0)throw new Error('Quantità o unità non interpretabile: '+qty+' '+(unit||''));
  return{qty:n*spec[1],unit:spec[0]};
}
function fromBase(base,unit){
  const one=toBase(1,unit);
  if(base.unit!==one.unit)throw new Error('Unità incompatibili: '+base.unit+' e '+unit);
  return base.qty/one.qty;
}
function addQuantity(a,b){
  const left=toBase(a.qty,a.unit),right=toBase(b.qty,b.unit);
  if(left.unit!==right.unit)throw new Error('Unità incompatibili: '+a.unit+' e '+b.unit);
  return{qty:fromBase({qty:left.qty+right.qty,unit:left.unit},a.unit),unit:a.unit};
}
function whFormat(format={}){
  try{if(Number(String(format.size).replace(',','.'))>0){toBase(format.size,format.unit);return{...format,size:Number(String(format.size).replace(',','.'))};}}catch(e){}
  // Accetta una sola misura, senza moltiplicatori o numeri ambigui.
  const label=String(format.label||'');
  const m=label.match(/^(?:[^\d]*?\s)?(\d+(?:[.,]\d+)?)\s*(kg|g|ml|l)\s*$/i);
  if(m&&Number(m[1].replace(',','.'))>0)return{...format,size:Number(m[1].replace(',','.')),unit:m[2].toLowerCase()==='l'?'L':m[2].toLowerCase()};
  return{...format,size:1,unit:'conf'};
}
function whPackageUnit(p,pk){
  // Un vecchio "conf" non dimostra quanto contenuto resti: non reinterpretarlo.
  if(pk.unit)return pk.unit;
  if(p.unit==='conf')return 'conf';
  const parsed=whFormat({label:pk.format});
  return parsed.unit!=='conf'?parsed.unit:(p.unit||p.u||'conf');
}
function whProducts(){
  return(S.get('dss_warehouse_v2',[])||[]).filter(Boolean).map(p=>{
    if(Array.isArray(p.packages))return p;
    const unit=p.unit||p.u||'conf';
    return{...p,name:p.n||p.name||'Prodotto',unit,packages:[{id:p.id+'_pkg0',unit,added_date:'2025-01-01',original_qty:p.ini??p.qty??0,remaining_qty:p.qty??0,format:''}]};
  });
}
function whTotal(p,field='remaining_qty'){
  if(!p)return 0;
  const unit=p.unit||p.u||'conf';
  try{return(p.packages||[{[field]:p.qty||0,unit}]).reduce((sum,pk)=>addQuantity(sum,{qty:pk[field]??(field==='original_qty'?(pk.qty??pk.size??pk.remaining_qty):0)??0,unit:whPackageUnit(p,pk)}),{qty:0,unit}).qty;}catch(e){return NaN;} // dati legacy incompatibili: richiedono verifica, mai somma grezza
}
function whAddPackages(products,entry){
  const existing=products.find(p=>(p.productId||p.id)===(entry.productId||entry.id));
  // La stessa guardia protegge aggiunta, totale, dosi e FIFO.
  toBase(whTotal(entry),entry.unit);
  if(!existing)return[...products,entry];
  addQuantity({qty:whTotal(existing),unit:existing.unit},{qty:whTotal(entry),unit:entry.unit});
  return products.map(p=>p!==existing?p:{...p,packages:[...p.packages,...entry.packages]});
}
function wfFifoUse(products,productId,amount,unit){
  const product=products.find(p=>p.id===productId);
  unit=unit||product?.unit||'conf';
  const request=toBase(amount,unit);
  let rem=request.qty;
  const consumed=[];
  const updated=products.map(p=>{
    if(p.id!==productId)return p;
    const sorted=[...p.packages].sort((a,b)=>(a.added_date||'').localeCompare(b.added_date||''));
    // Controlla TUTTE le confezioni prima di consumarne una.
    sorted.forEach(pk=>addQuantity({qty:0,unit},{qty:pk.remaining_qty||0,unit:whPackageUnit(p,pk)}));
    const newPkgs=sorted.map(pk=>{
      const pu=whPackageUnit(p,pk),have=toBase(pk.remaining_qty||0,pu);
      if(rem<=0||have.qty<=0)return pk;
      const take=Math.min(have.qty,rem);rem-=take;
      consumed.push({pkg_id:pk.id,used:fromBase({qty:take,unit:request.unit},pu),unit:pu,productId:p.id,productName:p.name});
      return{...pk,unit:pu,remaining_qty:fromBase({qty:have.qty-take,unit:request.unit},pu)};
    });
    return{...p,packages:newPkgs};
  });
  return{products:updated,consumed,used:fromBase({qty:request.qty-rem,unit:request.unit},unit)};
}
function whLogUse(productId,productName,unit,amount,opRef,operationId){
  const log=S.get('dss_warehouse_log',[])||[];
  S.set('dss_warehouse_log',[{id:Date.now(),dt:new Date().toISOString(),productId,productName,amount:Number(amount),unit,op:opRef||'',operationId},...log].slice(0,300));
}

function inferLegacyTypeForDefense(p){
  if(p.targetPests?.some(t=>/insetti|larve|afidi|grillotalpa|nematodi|acaro/i.test(t)))return'insetticida';
  if(p.targetPests?.some(t=>/funghi|muffa|marciume|fusarium|pythium|rhizoctonia/i.test(t)))return'fungicida';
  if(p.actives?.some(a=>/metribuzin|glifosate|cipermetrina|imidacloprid/i.test(a?.name||a)))return'insetticida';
  return null;
}

function toLegacyShape(p){
  const defenseType=inferLegacyTypeForDefense(p);
  const legacyType=defenseType||TYPE_MAP_NEW_TO_LEGACY[p.type]||'altro';
  const rawUnit=p.dose?.unit||'';
  const unit=rawUnit.startsWith('g')?'g':rawUnit.startsWith('ml')?'ml':rawUnit.startsWith('kg')?'kg':rawUnit.startsWith('L')?'L':'g';
  return {
    id:p.id,
    brand:p.brand,
    name:p.name,
    type:legacyType,
    unit,
    audienceLevel:p.audienceLevel||'prosumer',
    gddWindow:p.gddWindow||null,

}

function cleanReply(t){
  if(t==null)return '';
  let s=(''+t);
  s=s.replace(/^[ \t]*([*\-_=+/~]){3,}[ \t]*$/gm,'');           // righe-divisore decorative
  s=s.replace(/^#{1,6}\s*/gm,'');                                  // heading markers
  s=s.replace(/\*\*\*(.*?)\*\*\*/g,'$1').replace(/\*\*(.*?)\*\*/g,'$1').replace(/__(.*?)__/g,'$1'); // grassetto
  s=s.replace(/^[ \t]*[*\-+]\s+/gm,'• ');                         // bullet -> •
  s=s.replace(/[ \t]*(\+{2,}|\/{3,}|~{2,}|={3,})[ \t]*/g,' ');    // simboli decorativi residui
  s=s.replace(/`+/g,'');                                           // backtick
  s=s.replace(/\n{3,}/g,'\n\n').trim();                           // newline multipli
  return s;
}

    if(localOwner&&localOwner!==userId){
      console.warn('[loadUserData] local data owner mismatch ('+localOwner+'!='+userId+') — purge local garden');
      try{Object.keys(localStorage).forEach(k=>{if((k.startsWith('dss_')||k.startsWith('lawnly_'))&&k!==LAWNLY_JWT_KEY)localStorage.removeItem(k);});}catch(e){}
      localProf=null;
    }
    const localValid=localProf&&isProfileConfigured(localProf);
    const cloudValid=result.status==='ok'&&hasValidGardenData(result.data);

    if(cloudValid&&_lwHasPendingLocal()&&S.get('dss_profile',null)){
      // il push di riconciliazione (sopra) non e' andato a buon fine: tieni il locale e
      // riprova al prossimo salvataggio, invece di far vincere un cloud piu' vecchio
      console.warn('[loadUserData] modifiche locali non sincronizzate → tengo il locale');
      const keep=S.get('dss_profile',null);
      setProf({...normalizeProf(keep),_cloudUnreachable:false});
      S.set('dss_owner_uid',userId);
      if(keep.lat&&keep.onboardingCompleted)setTimeout(()=>fetchWx(keep),200);
      return;
    }

    if(cloudValid){
      const raw=result.data.profile;
      const normalized=normalizeProf(raw);
      const wasLegacy=!raw.audienceLevel;
      setProf({...normalized,_cloudUnreachable:false});
      S.set('dss_profile',normalized);
      S.set('dss_owner_uid',userId);
      Object.entries(result.data).forEach(([k,v])=>{if(k!=='profile')S.set(k,v);});
      if(userId&&(wasLegacy||Object.values(result.data.dss_zone_photos||{}).some(list=>(list||[]).some(inlineZonePhoto))))setTimeout(()=>profSet(normalized),0);
      if(normalized.lat&&normalized.onboardingCompleted)setTimeout(()=>fetchWx(normalized),200);
      console.log('[loadUserData] loaded from cloud');
      return;
    }

    if(result.status==='empty'&&localValid){
      console.log('[loadUserData] cloud empty, using local and syncing up');
      // rileggi adesso: tra l'inizio del caricamento e questo punto l'utente puo' aver salvato
      const pClean={...(S.get('dss_profile',null)||localProf)};delete pClean._cloudUnreachable;
      setProf({...pClean,_cloudUnreachable:false});
      S.set('dss_profile',pClean);
      S.set('dss_owner_uid',userId);
      if(pClean.lat&&pClean.onboardingCompleted)setTimeout(()=>fetchWx(pClean),200);
      setTimeout(()=>profSet(pClean),500);
      return;
    }

    if(result.status==='error'){
      console.warn('[loadUserData] cloud error, using local fallback WITHOUT reset');
      if(localValid){
        const pClean={...(S.get('dss_profile',null)||localProf)};delete pClean._cloudUnreachable;
        setProf({...pClean,_cloudUnreachable:false});
        S.set('dss_profile',pClean);
        if(pClean.lat&&pClean.onboardingCompleted)setTimeout(()=>fetchWx(pClean),200);
      }else{
        setErr('Connessione instabile. Riprova tra qualche secondo.');
        setProf(p=>({...normalizeProf(p),onboardingCompleted:false,_cloudUnreachable:true}));
      }
      return;
    }

    console.log('[loadUserData] truly first login — onboarding required');
    const forcedProf={...DEF_PROF,onboardingCompleted:false};
    S.set('dss_profile',forcedProf);
    S.set('dss_owner_uid',userId);
    setProf(forcedProf);
    setWx(null);
    setPg('oggi');
  };

  const runOnboardingGate=async sessionArg=>{
    const uid=sessionArg?.user?.id;
    if(!uid||!supa)return;
    await loadUserData(uid);
  };

  const retryCloudLoad=async()=>{
    if(!authUser?.id)return;
    setErr('');
    setAuthLoading(true);
    try{await loadUserData(authUser.id);}finally{setAuthLoading(false);}
  };

  /* ── Auth init: getSession + onAuthStateChange + timeout sicurezza (splash infinito) ── */
  useEffect(()=>{
    if(!supa){setAuthLoading(false);return;}
    let cancelled=false;
    const AUTH_SAFETY_MS=20000;
    const endSplash=()=>{if(!cancelled)setAuthLoading(false);};
    const safety=setTimeout(()=>{
      console.warn('[Lawnly] Auth: timeout '+AUTH_SAFETY_MS+'ms — chiusura splash (verifica rete / Supabase)');
      endSplash();
    },AUTH_SAFETY_MS);

    /* Un solo gate cloud per uid; evita doppio loadUserData se getSession e INITIAL_SESSION corrono insieme */
    const bootstrapCloudIfNeeded=async ses=>{
      if(cancelled||!ses?.user)return;
      if(lastCloudLoadUserRef.current===ses.user.id)return;
      if(authGateRef.current)return;
      authGateRef.current=true;
      try{
        await runOnboardingGate(ses);
        lastCloudLoadUserRef.current=ses.user.id;
      }finally{
        authGateRef.current=false;
      }
    };

    supa.auth.getSession().then(async({data:{session:ses}})=>{
      if(cancelled)return;
      setSession(ses||null);
      if(!ses?.user){
        setAuthUser(null);
        lastCloudLoadUserRef.current=null;
        clearTimeout(safety);
        endSplash();
        return;
      }
      setAuthUser(ses.user);
      try{
        await bootstrapCloudIfNeeded(ses);
      }catch(e){
        console.warn('[Lawnly] bootstrapCloudIfNeeded (getSession)',e);
      }
      clearTimeout(safety);
      endSplash();
    }).catch(e=>{
      console.warn('[Lawnly] getSession',e);
      clearTimeout(safety);
      endSplash();
    });

    const{data:{subscription}}=supa.auth.onAuthStateChange(async(event,ses)=>{
      if(cancelled)return;
      setSession(ses);
      if(!ses?.user){
        setAuthUser(null);
        lastCloudLoadUserRef.current=null;
        clearTimeout(safety);
        endSplash();
        return;
      }
      setAuthUser(ses.user);
      if((event==='INITIAL_SESSION'||event==='SIGNED_IN')&&lastCloudLoadUserRef.current!==ses.user.id&&!authGateRef.current){
        try{
          await bootstrapCloudIfNeeded(ses);
        }catch(e){
          console.warn('[Lawnly] bootstrapCloudIfNeeded (onAuthStateChange)',e);
        }
      }
      clearTimeout(safety);
      endSplash();
    });
    return()=>{cancelled=true;clearTimeout(safety);subscription.unsubscribe();};
  },[]);

  /* ── Wrapped S.set that also syncs ── */
  const profSet=async(newProf)=>{
    setProf(newProf);S.set('dss_profile',newProf);
    const uid=authUser?.id;if(!uid)return;
    syncCloud(uid,collectLocalState(newProf));
  };

  /* ── Sync on-demand da componenti figli (es. chat Dottor Verde) ── */
  useEffect(()=>{
    const h=()=>{const cur=S.get('dss_profile',null);profSet(cur&&typeof cur==='object'?cur:prof);};
    window.addEventListener('lawnly:sync',h);
    return()=>window.removeEventListener('lawnly:sync',h);
  },[prof,authUser?.id]);

  /* ── Weather ── */
  const [lastFetchAt,setLastFetchAt]=useState(null);
  /* PATCH v7.7 — fetchWx accetta forceFresh per bypass cache (refresh manuale utente) */
  const fetchWx=useCallback(async(p=prof,forceFresh=false)=>{
    if(!p?.lat||!p?.lon){setErr('Configura la posizione GPS nel Profilo per i dati meteo.');return;}
    setLdg(true);setErr('');
    try{
      let d;
      try{
        d=await loadWxCached(p.lat,p.lon,p.year||new Date().getFullYear(),p.gddBase||5,p.timezone||'Europe/Rome',p.grassMixture||'microterme',forceFresh);
      }catch(e1){
        // Retry automatico dopo 3s (Open-Meteo occasionalmente dà errori transitori)
        console.warn('[Lawnly] fetchWx primo tentativo fallito, retry in 3s:',e1.message);
        await new Promise(r=>setTimeout(r,3000));
        d=await loadWxCached(p.lat,p.lon,p.year||new Date().getFullYear(),p.gddBase||5,p.timezone||'Europe/Rome',p.grassMixture||'microterme',true);
      }
      setWx(d);
      try{window.__LAWNLY_WX__=d;}catch(e){}
      setLastFetchAt(new Date().toISOString());
    }catch(e){
      const msg=e.message||'';
      const friendly=msg.includes('abort')||msg.includes('Abort')
        ?'Open-Meteo non risponde (timeout 15s). Riprova tra qualche minuto.'
        :msg.includes('429')
        ?'Open-Meteo: troppe richieste. Riprova tra 1-2 minuti.'
        :'Dati meteo non disponibili ('+msg.slice(0,60)+'). Riprova.';
      setErr(friendly);
    }
    setLdg(false);
  },[]);
  useEffect(()=>{if(prof?.onboardingCompleted&&prof?.lat)fetchWx();},[]);
  /* visibilitychange: ricarica se cache > 30min */
  useEffect(()=>{
    if(wxRefreshKey>0 && prof?.lat && prof?.lon && prof?.onboardingCompleted){
      const ageMin=lastFetchAt?(Date.now()-new Date(lastFetchAt).getTime())/60000:999;
      if(ageMin>30) fetchWx(prof,false);
    }
  },[wxRefreshKey]);

  useEffect(()=>{
    if(!authLoading){runControllerCatchup();}
  },[authLoading,wx,wxRefreshKey,prof?.controller?.on]);

  /* Auto-refresh orario: ogni 60 min controlla e ricarica se dati stale */
  useEffect(()=>{
    if(!prof?.lat||!prof?.lon||!prof?.onboardingCompleted)return;
    const id=setInterval(()=>{
      const ageMin=lastFetchAt?(Date.now()-new Date(lastFetchAt).getTime())/60000:999;
      if(ageMin>=60){
        console.log('[Lawnly] auto-refresh meteo (age='+Math.round(ageMin)+'min)');
        fetchWx(prof,false);
      }
    },5*60*1000); // controlla ogni 5min, refresha solo se ≥60min
    return()=>clearInterval(id);
  },[prof?.lat,prof?.lon,prof?.onboardingCompleted,lastFetchAt]);

  useEffect(()=>{
    if(typeof window!=='undefined'){
      window.__LAWNLY_DEBUG=window.__LAWNLY_DEBUG||{};
      window.__LAWNLY_DEBUG.environment={
        version:'step12',
        deployedAt:new Date().toISOString(),
        userId:session?.user?.id||null,
        userAgent:navigator.userAgent,
        platform:navigator.platform,
        viewport:{w:window.innerWidth,h:window.innerHeight}
      };
      window.__LAWNLY_DEBUG.dumpJson=()=>JSON.stringify(window.__LAWNLY_DEBUG,(k,v)=>{if(k==='dumpJson')return undefined;return v;},2);
    }
  },[session]);

  /* ── Debug globale: window.__LAWNLY_DEBUG (Step 10.4) ── */
  useEffect(()=>{
    if(typeof window==='undefined') return;
    try{
      const soilArr=S.get('dss_soil_data',[])||[];
      const soil=soilArr[0]||null;
      const indicators=wx&&prof?computeClimateIndicators(wx,prof,soil):null;
      const rules=deriveOperationalRules(indicators);
      window.__LAWNLY_DEBUG={...window.__LAWNLY_DEBUG,indicators,rules,wx,prof,soil,timezone:prof?.timezone||'Europe/Rome',computedAt:new Date().toISOString()};
    }catch(e){console.warn('[__LAWNLY_DEBUG] failed to build',e);}
  },[wx,prof]);


  /* ── Daily update θ persistente per zona (Step 10.3) ── */
  useEffect(()=>{
    if(!wx||!prof?.zones?.length)return;
    const lastRun=S.get('dss_soil_theta_last_run');
    const today=new Date().toISOString().slice(0,10);
    if(lastRun===today)return; // già aggiornato oggi
    const yesterday=wx.history?.[wx.history.length-1];
    if(!yesterday)return;
    const irr=getIrrigationHistoryForGarden(prof);
    prof.zones.forEach(z=>{
      advanceSoilTheta(z.id,z,yesterday,irr,prof.soilType||'loam',prof.grassMixture||'microterme');
    });
    S.set('dss_soil_theta_last_run',today);
    console.log('[soil-theta] advanced for',today);
  },[wx,prof]);

  /* ── Onboarding complete ── */
  const completeOnboarding=async(formData)=>{
    const gid=formData.gardenId||(typeof crypto!=='undefined'&&crypto.randomUUID?crypto.randomUUID():'g'+Date.now());
    const gCreated=formData.gardenCreatedAt||new Date().toISOString();
    const finalProf={...formData,onboardingCompleted:true,gardenId:gid,gardenCreatedAt:gCreated};
    S.set('dss_profile',finalProf);
    setProf(finalProf);
    S.set('dss_guide_dismissed',false);
    // Reset tutorial "seen" flags — al nuovo giardino si ripresentano tutti
    const tutorialKeys=Object.keys(TUTORIALS);
    tutorialKeys.forEach(k=>S.set('dss_help_seen_v2_'+k,false));
    // Attendi esplicitamente il sync cloud prima di proseguire
    try{
      await profSet(finalProf);
      console.log('[completeOnboarding] synced to cloud');
    }catch(e){
      console.error('[completeOnboarding] cloud sync failed, keeping local:',e);
    }
    if(finalProf.lat)fetchWx(finalProf);
  };

  /* ── Auth handlers ── */
  const handleAuth=async(user,ses)=>{setAuthUser(user);if(ses) setSession(ses);};
  const setZones=null;
  const setOnboardingStep=null;
  const resetGarden=useCallback(async(skipConfirm=false,opts={})=>{
    const{skipRedirect=false}=opts||{};
    if(!skipConfirm){
      const ok=window.confirm(
        'Reset giardino: verranno cancellati TUTTI i dati del giardino corrente '+
        '(irrigazioni, misurazioni del suolo, foto, note, zone, calendario, magazzino). '+
        'L\'account utente verra disconnesso. Operazione IRREVERSIBILE. Procedere?'
      );
      if(!ok)return {ok:false,reason:'user-cancelled'};
    }

    const userId=(typeof currentUserId!=='undefined'&&currentUserId)
      ?currentUserId
      :(window.__LAWNLY_DEBUG&&window.__LAWNLY_DEBUG.currentUserId);

    console.log('[Lawnly] reset: starting, userId=',userId);

    if(supa&&userId){
      const tablesToWipe=[
        'irrigations','soil_measurements','zone_photos','zone_notes',
        'zones','gardens','calendar_operations','product_inventory',
        'inventory_packages','treatment_history','ai_chat_history',
        'ai_diagnoses','photo_analyses'
      ];
      const wipePromise=(async()=>{
        for(const table of tablesToWipe){
          try{
            const{error,count}=await supa.from(table).delete({count:'exact'}).eq('user_id',userId);
            if(error){
              const isMissing=error.code==='42P01'||/does not exist/i.test(error.message||'');
              console.log(`[Lawnly] reset: ${isMissing?'skipped':'failed'} ${table}`,isMissing?'':error.message);
            }else{
              console.log(`[Lawnly] reset: wiped ${table}: ${count??0} rows`);
            }
          }catch(e){
            console.warn(`[Lawnly] reset: exception ${table}:`,e.message);
          }
        }
      })();
      const timeoutPromise=new Promise(r=>setTimeout(()=>{
        console.warn('[Lawnly] reset: Supabase wipe timeout 3s, continuo comunque');
        r();
      },3000));
      try{
        await Promise.race([wipePromise,timeoutPromise]);
      }catch(e){
        console.warn('[Lawnly] reset: race error',e.message);
      }
    }

    if(typeof markCloudReset==='function'&&userId){
      try{
        await Promise.race([
          markCloudReset(userId),
          new Promise(r=>setTimeout(r,1000))
        ]);
      }catch(e){
        console.warn('[Lawnly] reset: markCloudReset error',e.message);
      }
    }

    const localKeysRemoved=[];
    try{
      Object.keys(localStorage).forEach(k=>{
        if(k.startsWith('dss_')||k.startsWith('lawnly_')){
          localStorage.removeItem(k);
          localKeysRemoved.push(k);
        }
      });
      console.log(`[Lawnly] reset: removed ${localKeysRemoved.length} localStorage keys:`,localKeysRemoved);
    }catch(e){
      console.warn('[Lawnly] reset: localStorage cleanup error',e.message);
    }

    try{sessionStorage.clear();console.log('[Lawnly] reset: cleared sessionStorage');}catch(e){}

    try{setProf&&setProf(null);}catch(e){}
    try{setZones&&setZones([]);}catch(e){}
    try{setOnboardingStep&&setOnboardingStep(0);}catch(e){}

    if(supa){
      try{
        console.log('[Lawnly] reset: signing out from Supabase');
        await Promise.race([
          supa.auth.signOut(),
          new Promise(r=>setTimeout(r,2000))
        ]);
      }catch(e){
        console.warn('[Lawnly] reset: signOut error',e.message);
      }
    }

    console.log('[Lawnly] reset: COMPLETE — redirecting to register page');

    if(!skipRedirect){
      setTimeout(()=>{
        try{
          window.location.href=window.location.pathname+'?reset=garden&t='+Date.now();
        }catch(e){
          window.location.reload();
        }
      },100);
    }

    return {ok:true,localKeysRemoved:localKeysRemoved.length};
  },[setProf,setZones,setOnboardingStep]);

  const deleteAccount=useCallback(async()=>{
    if(!window.confirm('Eliminare definitivamente l\'account? Account e dati del prato vengono cancellati dai nostri server. Operazione irreversibile.'))return;
    const pw=window.prompt('Per confermare inserisci la password del tuo account'); // ponytail: prompt di sistema, mostra la password in chiaro; foglio dedicato se i tester lo chiedono
    if(!pw)return;
    const r=await supa.auth.deleteAccount(pw);
    if(r.error){window.alert('Account non eliminato: '+r.error.message);return;}
    try{window.LawnlyNative&&window.LawnlyNative.logOut();}catch(e){}
    // token via PRIMA della pulizia: nessun salvataggio in sospeso può ricreare i dati sul server
    await supa.auth.signOut();
    await resetGarden(true,{skipRedirect:true});
    setAuthUser(null);
    setSession(null);
    window.location.href=window.location.pathname+'?reset=account';
  },[resetGarden]);

  const handleLogout=async()=>{
    // prima di uscire, chiudi il salvataggio in sospeso: il debounce di 1s bastava a perdere
    // l'ultima modifica di chi fa logout subito dopo aver toccato qualcosa
    try{ if(_lwPending&&_lwHasPendingLocal()){ clearTimeout(syncTimer); await _lwFlushPending(); } }catch(e){ console.warn('[logout] salvataggio finale non riuscito:',e.message); }
    try{const N=window.LawnlyNative;if(N){N.hideBanner();N.logOut();}}catch(e){}
    // Dopo il flush finale la coda va svuotata: quello che resta appartiene a chi sta uscendo,
    // e su un telefono condiviso finirebbe nell'account di chi entra dopo.
    try{ clearTimeout(syncTimer); _lwPending=null; _lwMarkDirty(false); }catch(e){}
    if(supa)await supa.auth.signOut();S.set('dss_profile',DEF_PROF);setProf({...DEF_PROF});setAuthUser(null);setSession(null);setWx(null);};

  useEffect(()=>{
    if(typeof window==='undefined')return;
    currentUserId=authUser?.id||session?.user?.id||null;
    window.__LAWNLY_DEBUG=window.__LAWNLY_DEBUG||{};
    window.__LAWNLY_DEBUG.currentUserId=currentUserId;
    try{const N=window.LawnlyNative;if(N&&N.isNative&&N._uid!==currentUserId){N._uid=currentUserId;if(currentUserId)N.init(currentUserId).then(()=>{N.logIn(currentUserId);N.showBanner();});else N.hideBanner();}}catch(e){}
    window.__LAWNLY_DEBUG.currentGardenId=prof?.gardenId||null;
    window.__LAWNLY_DEBUG.resetFunctions={
      resetGarden,
      /* resetGarden(true) per skip confirm */
    };
    window.__LAWNLY_DEBUG.tableCounts=async()=>{
      const userId=currentUserId||window.__LAWNLY_DEBUG.currentUserId;
      if(!userId)return null;
      const tables=['irrigations','soil_measurements','zone_photos','zone_notes','zones','gardens','calendar_operations','product_inventory','inventory_packages','treatment_history','ai_chat_history','ai_diagnoses','photo_analyses'];
      const counts={};
      for(const table of tables){
        try{
          const{count,error}=await supa.from(table).select('*',{count:'exact',head:true}).eq('user_id',userId);
          counts[table]=error?`ERR: ${error.code}`:count;
        }catch(e){
          counts[table]=`EXC: ${e.message}`;
        }
      }
      return counts;
    };
    window.__LAWNLY_DEBUG.aiCallsToday=getAiCallsToday;
    window.__LAWNLY_DEBUG.aiHealth={
      consecutiveFails:getAiFails,
      reset:resetAiFails
    };
  },[authUser,session,prof?.gardenId,resetGarden,deleteAccount]);

  /* ── Loading ── */
  if(authLoading)return html`<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;background:var(--bg)">
    <div style="font-size:40px">🌿</div>
    <div class="spinner spinner-g"></div>
  </div>`;

  /* ── Auth gate ── */
  if(!authUser&&supa)return html`<${AuthScreen} onAuth=${handleAuth}/>`;

  if(prof?._cloudUnreachable)return html`<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;padding:24px;background:var(--bg);text-align:center">
    <div style="font-size:40px">🌿</div>
    <div style="font-size:16px;font-weight:700;color:var(--text);max-width:320px">Connessione instabile</div>
    <div style="font-size:12px;color:var(--muted);line-height:1.6;max-width:300px">${err||'Non siamo riusciti a caricare i dati dal cloud. Controlla la rete e riprova.'}</div>
    <button class="btn btn-p" style="padding:12px 20px" onClick=${retryCloudLoad} disabled=${authLoading}>${authLoading?html`Attendere…`:'Riprova'}</button>
  </div>`;

  /* ── Onboarding ── */
  if(!isProfileConfigured(prof))return html`<${OnboardingNew} onComplete=${completeOnboarding}/>`;

  const PAGES={
    prato:html`<${Prato} prof=${prof} wx=${wx}/>`,
    oggi:html`<${Oggi} wx=${wx} prof=${prof} setPg=${setPg}/>`,
    meteo2:html`<${Meteo2} wx=${wx} prof=${prof}/>`,
    piano:html`<${Piano} prof=${prof} wx=${wx} setPg=${setPg}/>`,
    mag:html`<${Magazzino2} prof=${prof} setPg=${setPg}/>`,
    profilo2:html`<${Profilo2} prof=${prof} wx=${wx} setPg=${setPg} setProf=${setProf} onResetGarden=${resetGarden} onLogout=${handleLogout} onDeleteAccount=${deleteAccount}/>`,
  };

  return html`<div>
    <main class=${['oggi','prato','meteo2','piano','mag','profilo2'].includes(pg)?'main-rdz':''}>
      <div key=${pg} class="anim">${PAGES[pg]||''}</div>
      <footer class="partner-credit"><span>prodotti</span><img src="padana-logo.png" alt="Padana Sementi" style="height:14px;width:auto"/></footer>
    </main>
    <${BNav} pg=${pg} setPg=${setPg}/>
  </div>`;
}

/* Rete di sicurezza: senza questa, un errore in un solo componente lasciava la pagina bianca
   e l'unico rimedio era svuotare il browser (perdendo lo stato non sincronizzato). */
class ErrorBoundary extends preact.Component{
  constructor(p){super(p);this.state={err:null};}
  static getDerivedStateFromError(err){return {err};}
  componentDidCatch(err,info){console.error('[Lawnly] errore non gestito:',err,info);}
  render(){
    if(!this.state.err)return this.props.children;
    const msg=String(this.state.err&&this.state.err.message||this.state.err||'errore');
    return html`<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--bg,#F4F1E8);color:var(--ink,#1A2016);font-family:-apple-system,Inter,sans-serif">
      <div style="max-width:420px;text-align:center">
        <div style="font-size:40px;margin-bottom:10px">🌱</div>
        <div style="font-size:18px;font-weight:800;margin-bottom:8px">Qualcosa si è inceppato</div>
        <div style="font-size:13px;line-height:1.5;opacity:.75;margin-bottom:18px">I tuoi dati sono al sicuro sul telefono e sul tuo account. Ricarica la pagina: se ricapita, scrivilo sulla board dei test con questa riga.</div>
