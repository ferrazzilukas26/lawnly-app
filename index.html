async function fileToBase64(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=e=>res(e.target.result.split(',')[1]);r.onerror=rej;r.readAsDataURL(file);});}
/* Le foto dei telefoni pesano 3-6 MB l'una: salvate intere riempivano lo storage del browser
   e gonfiavano ogni sincronizzazione. 1280px bastano sia all'analisi AI sia alla galleria. */
async function shrinkImageFile(file,maxSide=1280,quality=0.72){
  const mediaType=file&&file.type||'image/jpeg';
  try{
    const img=await createImageBitmap(file);
    const sc=Math.min(1,maxSide/Math.max(img.width,img.height));
    const c=document.createElement('canvas');
    c.width=Math.round(img.width*sc); c.height=Math.round(img.height*sc);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    const url=c.toDataURL('image/jpeg',quality);
    try{img.close&&img.close();}catch(e){}
    return {b64:url.split(',')[1],mediaType:'image/jpeg',dataUrl:url};
  }catch(e){
    console.warn('[foto] ridimensionamento non riuscito, uso l\'originale:',e.message);
    const b64=await fileToBase64(file);
    return {b64,mediaType,dataUrl:'data:'+mediaType+';base64,'+b64};
  }
}
function parseAIPlan(raw){

/* ═════════════════════════════════════════════════════════════
   PIANO ANNUALE — generateAnnualPlan (AI strict JSON + fallback)
   ═════════════════════════════════════════════════════════════ */
const MONTH_NAME_TO_NUM={Gennaio:1,Febbraio:2,Marzo:3,Aprile:4,Maggio:5,Giugno:6,Luglio:7,Agosto:8,Settembre:9,Ottobre:10,Novembre:11,Dicembre:12};
function normalizeCalendarOp(op){
  if(!op||typeof op!=='object')return op;
  const o={...op};
  if(typeof o.month==='string'){
    const mn=o.month.trim();
    o.month=MONTH_NAME_TO_NUM[mn]||parseInt(mn,10)||null;
  }
  if(o.month!=null&&typeof o.month!=='number')o.month=parseInt(o.month,10)||null;
  /* PATCH v9 — gli eventi AI salvano date valida ma week:0 e status:'planned'.
     Le viste Calendario/Dashboard filtrano per week e per status==='programmato' →
     senza questa normalizzazione gli eventi AI sono INVISIBILI e "Da fare ora" è vuota. */
  const _d=o.date||o.dt;
  if(_d){
    const dd=new Date((''+_d).slice(0,10)+'T12:00:00');
    if(!isNaN(dd.getTime())){
      if(!o.week||o.week<=0){
        try{ o.week=(typeof _isoWeek==='function')?_isoWeek(dd):Math.ceil(((dd-new Date(dd.getFullYear(),0,1))/86400000+1)/7); }catch(e){}
      }
      if(o.month==null)o.month=dd.getMonth()+1;
      if(o.year==null)o.year=dd.getFullYear();
    }
  }
  // 'planned' (default eventi AI) è uno scheduled attivo come 'programmato' — unifica per i filtri
  if(o.status==='planned')o.status='programmato';
  return o;
}
function readCalendarEvents(){
  return(S.get('dss_calendar_events',[])||[]).filter(Boolean).map(normalizeCalendarOp);
}

/* ═══ PATCH 06D-B.3a — MACCHINA A STATI CALENDARIO (donor Elia, adattata date-based)
   7 stati canonici. Gli status legacy ('completato','programmato','saltato','posticipato')
   restano nello storage per compat con tutti i filtri esistenti: qui solo LETTURA via predicati. */
const OP_STATUS={DA_VALUTARE:'da_valutare',IN_ATTESA:'in_attesa',CONFERMATA:'confermata',ESEGUITA:'eseguita',POSTICIPATA:'posticipata',SALTATA:'saltata',BLOCCATA:'bloccata'};
const OP_STATUS_LABEL={da_valutare:'Da valutare',in_attesa:'In attesa',confermata:'Confermata',eseguita:'Eseguita',posticipata:'Posticipata',saltata:'Saltata',bloccata:'Bloccata'};
const OP_STATUS_COLOR={
  da_valutare:{bg:'#EEF2FF',fg:'#4338CA',bd:'#C7D2FE',dfg:'#A5B4FC'},
  in_attesa:  {bg:'#F8FAFC',fg:'#475569',bd:'#E2E8F0',dfg:'#94A3B8'},
  confermata: {bg:'#ECFDF5',fg:'#047857',bd:'#A7F3D0',dfg:'#6EE7B7'},
  eseguita:   {bg:'#DCFCE7',fg:'#166534',bd:'#86EFAC',dfg:'#86EFAC'},
  posticipata:{bg:'#FFFBEB',fg:'#B45309',bd:'#FDE68A',dfg:'#FCD34D'},
  saltata:    {bg:'#F1F5F9',fg:'#64748B',bd:'#CBD5E1',dfg:'#94A3B8'},
  bloccata:   {bg:'#FEF2F2',fg:'#B91C1C',bd:'#FECACA',dfg:'#FCA5A5'}
};
const _LEGACY_STATUS_MAP={
  completato:OP_STATUS.ESEGUITA,done:OP_STATUS.ESEGUITA,confirmed:OP_STATUS.ESEGUITA,eseguita:OP_STATUS.ESEGUITA,completed:OP_STATUS.ESEGUITA,
  programmato:OP_STATUS.IN_ATTESA,planned:OP_STATUS.IN_ATTESA,in_attesa:OP_STATUS.IN_ATTESA,pianificato:OP_STATUS.IN_ATTESA,
  saltato:OP_STATUS.SALTATA,saltata:OP_STATUS.SALTATA,skipped:OP_STATUS.SALTATA,
  posticipato:OP_STATUS.POSTICIPATA,posticipata:OP_STATUS.POSTICIPATA,postponed:OP_STATUS.POSTICIPATA,
  confermata:OP_STATUS.CONFERMATA,confermato:OP_STATUS.CONFERMATA,
  bloccata:OP_STATUS.BLOCCATA,bloccato:OP_STATUS.BLOCCATA,blocked:OP_STATUS.BLOCCATA,
  da_valutare:OP_STATUS.DA_VALUTARE
};
function migrateOpStatus(op){
  if(!op||typeof op!=='object')return OP_STATUS.IN_ATTESA;
  if(op.confirmed===true&&!op.status)return OP_STATUS.ESEGUITA;
  if(op.done===true||op.completed===true)return OP_STATUS.ESEGUITA;
  const raw=String(op.status||'').trim().toLowerCase();
  if(!raw)return(op.ai_generated||op.ai)?OP_STATUS.DA_VALUTARE:OP_STATUS.IN_ATTESA;
  return _LEGACY_STATUS_MAP[raw]||OP_STATUS.IN_ATTESA;
}
const opStatus=op=>migrateOpStatus(op);
const isOpSkipped=op=>opStatus(op)===OP_STATUS.SALTATA;
const isOpOpen=op=>{const s=opStatus(op);return s===OP_STATUS.DA_VALUTARE||s===OP_STATUS.IN_ATTESA||s===OP_STATUS.CONFERMATA||s===OP_STATUS.POSTICIPATA;};
const isOpClosed=op=>{const s=opStatus(op);return s===OP_STATUS.ESEGUITA||s===OP_STATUS.SALTATA;};

/* ═══ PATCH 06D-B.3b — ORIZZONTE MOBILE (adattato date-based: 12 settimane = 84 giorni).
   Il piano avanza solo quando gli arretrati sono chiusi. */
const HORIZON_DAYS=84;
const STALE_BATCH_DAYS=60,STALE_RESET_DAYS=180;
const _opISO=op=>((op&&(op.date||op.dt))||'').slice(0,10);
const isOpOverdue=(op,todayISO)=>{const d=_opISO(op);return !!d&&d<(todayISO||new Date().toISOString().slice(0,10))&&isOpOpen(op);};
function getOverdueOps(evs){const t=new Date().toISOString().slice(0,10);return(evs||[]).filter(o=>o&&isOpOverdue(o,t));}
let _sessionDaysAway=null;
function daysSinceLastActive(){
  if(_sessionDaysAway!==null)return _sessionDaysAway;
  try{const t=S.get('dss_last_active_at',null);_sessionDaysAway=t?Math.max(0,Math.floor((Date.now()-new Date(t).getTime())/86400000)):0;}catch(e){_sessionDaysAway=0;}
  return _sessionDaysAway;
}
function markActive(){daysSinceLastActive();try{S.set('dss_last_active_at',new Date().toISOString());}catch(e){}}
function calendarStaleness(evs){
  const days=daysSinceLastActive();
  const overdue=getOverdueOps(evs);
  if(days>=STALE_RESET_DAYS)return{level:'reset',days,overdue,count:overdue.length};
  if(days>=STALE_BATCH_DAYS||overdue.length>=6)return{level:'batch',days,overdue,count:overdue.length};
  return{level:'ok',days,overdue,count:overdue.length};
}
function computeHorizon(evs){
  const overdue=getOverdueOps(evs);
  const stale=calendarStaleness(evs);
  const today=new Date();
  if(overdue.length>0)return{dateISO:new Date(today.getTime()+HORIZON_DAYS*86400000).toISOString().slice(0,10),blocked:true,reason:stale.level==='reset'?'reset':'overdue',overdueCount:overdue.length,staleness:stale};
  return{dateISO:new Date(today.getTime()+HORIZON_DAYS*86400000).toISOString().slice(0,10),blocked:false,reason:null,overdueCount:0,staleness:stale};
}
function withinHorizon(op,horizonISO){
  const d=_opISO(op);
  if(!d)return true;
  if(isOpClosed(op))return true;
  return d<=horizonISO;
}
try{window.OP_STATUS=OP_STATUS;window.__LAWNLY_DEBUG=window.__LAWNLY_DEBUG||{};Object.assign(window.__LAWNLY_DEBUG,{opStatus,getOverdueOps,computeHorizon,calendarStaleness});}catch(e){}

function computeGrowthPotential(tmax,tmin,grassType){
  if(tmax==null||tmin==null)return null;
  const tAvg=(parseFloat(tmax)+parseFloat(tmin))/2;
  const isCool=!grassType||/micro|festuca|lolium|poa|cool/i.test(grassType);
  const tOpt=isCool?20:31;
  const sigma=isCool?5.5:7.0;
  const score=Math.round(Math.exp(-0.5*Math.pow((tAvg-tOpt)/sigma,2))*100);
  return{score,tOpt,tAvg:Math.round(tAvg*10)/10};
}

/* PATCH 06D-B.2 — validateOperation rule engine
   B.1 N/K timing (14gg) · B.2 scarif+arieg (21gg) · B.3 max 2 meccaniche/mese · B.5 stesso prodotto (7gg)
   Ritorna {errors:string[], warnings:string[], valid:bool}
   errors = hard block · warnings = conferma utente */
function validateOperation(newEv,allEvs,catalog,wx,grassType){
  const errors=[];
  const warnings=[];
  const week=newEv.week||0;
  const month=newEv.month||0;
  const getNpk=id=>{
    if(!id||!catalog)return null;
    const p=catalog.find(c=>c.id===id);
    return p?.npk||null;
  };
  const isHighN=npk=>npk&&npk.n>=15&&npk.n>(npk.k||0)*1.4;
  const isHighK=npk=>npk&&npk.k>=10&&npk.k>(npk.n||0)*1.2;
  const nearby=dw=>(allEvs||[]).filter(e=>
    e.id!==newEv.id&&week>0&&Math.abs(new Date(e.date||e.dt)-new Date(newEv.date||newEv.dt))<=dw*7*86400000
  );
  // B.1 — N/K entro 14gg (2 settimane)
  if(newEv.category==='concimazione'&&newEv.finalProductId){
    const npk=getNpk(newEv.finalProductId);
    if(isHighN(npk)){
      const c=nearby(2).find(e=>e.category==='concimazione'&&isHighK(getNpk(e.finalProductId)));
      if(c)warnings.push('N + K a '+(Math.abs((c.week||0)-week))+' sett. di distanza: rischio eccesso salino. Consigliato ≥14 giorni tra le due applicazioni.');
    }
    if(isHighK(npk)){
      const c=nearby(2).find(e=>e.category==='concimazione'&&isHighN(getNpk(e.finalProductId)));
      if(c)warnings.push('K + N a '+(Math.abs((c.week||0)-week))+' sett. di distanza: rischio eccesso salino. Consigliato ≥14 giorni tra le due applicazioni.');
    }
  }
  // B.2 — Scarif + Arieg entro 21gg (3 settimane) — hard block
  if(newEv.category==='meccanica'){
    const nm=(newEv.name||'').toLowerCase();
    const isSc=/scarif/.test(nm);
    const isAr=/arieg/.test(nm);
    if(isSc||isAr){
      const rx=isSc?/arieg/:/scarif/;
      const c=nearby(3).find(e=>e.category==='meccanica'&&rx.test((e.name||'').toLowerCase()));
      if(c)errors.push('Scarificatura e arieggiatura non possono essere eseguite entro 21 giorni (rilevato: '+(Math.abs((c.week||0)-week))+' sett.). Lascia riprendere il prato.');
    }
  }
  // B.3 — Max 2 meccaniche per mese
  if(newEv.category==='meccanica'&&month>0){
    const same=(allEvs||[]).filter(e=>e.id!==newEv.id&&e.category==='meccanica'&&e.year===newEv.year&&(e.month||0)===month);
    if(same.length>=2)warnings.push('Hai già '+same.length+' operazioni meccaniche questo mese. Il prato rischia stress da lavorazioni eccessive.');
  }
  // B.5 — Stesso prodotto entro 7gg (1 settimana)
  if(newEv.finalProductId){
    const c=nearby(1).find(e=>e.finalProductId===newEv.finalProductId);
    if(c)warnings.push('Stesso prodotto applicato a '+(Math.abs((c.week||0)-week))+' sett. di distanza. Verifica l\'intervallo minimo di riapplicazione.');
  }
  // B.4 — Trigger stagionali (richiede wx + grassType)
  if(wx){
    const _gp=computeGrowthPotential(wx.tmax,wx.tmin,grassType||'microterme');
    // B.4a — GP-N switch: blocca azoto se prato non cresce
    if(newEv.category==='concimazione'&&newEv.finalProductId){
      const _npk4=getNpk(newEv.finalProductId);
      if(isHighN(_npk4)&&_gp!=null){
        if(_gp.score<25)errors.push('GP: '+_gp.score+'% — crescita minima. L\'azoto non viene assorbito e rischia di bruciare il prato. Aspetta condizioni migliori (GP > 35%).');
        else if(_gp.score<35)warnings.push('GP: '+_gp.score+'% — crescita rallentata. L\'azoto sarà poco efficace. Considera dosi ridotte o un biostimolante al posto del concime N.');
      }
    }
    // B.4b — Stress estivo: no meccanica con tmax >= 32°C
    if(newEv.category==='meccanica'&&wx.tmax!=null&&wx.tmax>=32){
      warnings.push('Temperatura massima: '+wx.tmax+'°C. Le lavorazioni meccaniche sotto stress termico danneggiano il prato. Aspetta temperature < 28°C.');
    }
    // B.4c — Microdochium: concimazione N con T bassa + umidità alta
    if(newEv.category==='concimazione'&&newEv.finalProductId&&
       wx.tmin!=null&&wx.tmax!=null&&wx.humidity!=null&&
       wx.tmin<=5&&wx.tmax<=15&&wx.humidity>=80){
      const _npk4c=getNpk(newEv.finalProductId);
      if(isHighN(_npk4c))warnings.push('Rischio Microdochium: T '+wx.tmin+'–'+wx.tmax+'°C + umidità '+Math.round(wx.humidity)+'%. Evita l\'azoto in queste condizioni — valuta prima un trattamento fungicida preventivo.');
    }
    // B.4d — Pre-inverno: no N pesante in ott-nov
    if(newEv.category==='concimazione'&&newEv.month>=10&&newEv.month<=11){
      const _npk4d=getNpk(newEv.finalProductId);
      if(isHighN(_npk4d))warnings.push('Concimazione azotata in '+(['Ottobre','Novembre'][newEv.month-10])+': il prato rallenta la crescita. Preferisci un fertilizzante equilibrato o a prevalenza K per prepararlo all\'inverno.');
    }
  }
  return{errors,warnings,valid:errors.length===0};
}

// Ingresso applicativo comune a calendario, dashboard e chat.
function prepareCalendarOperation(op){
  const {_raw,opCat,...fields}=op;
  let n=normalizeCalendarOp({...fields,name:op.name||op.title||op.phase||'Operazione'});
  n.id=n.id||'op_'+Date.now()+'_'+Math.random().toString(36).slice(2);
  n.year=Number(n.year)||new Date().getFullYear();
  if(!n.date&&!n.dt&&n.week>0){
    const d=new Date(n.year,0,4,12);d.setDate(d.getDate()-((d.getDay()+6)%7)+(Number(n.week)-1)*7);
    n=normalizeCalendarOp({...n,date:d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')});
  }
  const catalog=window.__LAWNLY_CATALOG__||[];
  const wh=whProducts();
  const stock=wh.find(p=>p.id===(n.finalProductId||n.suggestedProductId));
  const needle=String(n.product||n.name).toLowerCase().trim();
  const product=catalog.find(p=>p.id===(stock?.productId||n.finalProductId||n.suggestedProductId))||catalog.find(p=>[p.name,((p.brand||'')+' '+p.name).trim()].some(v=>String(v).toLowerCase()===needle));
  if(product)n.finalProductId=product.id;
  n.category=n.category||(/scarif|arieg|carot|verticut|taglio|tosatur|meccanic/i.test(n.name+' '+n.type)?'meccanica':({concime:'concimazione',fertilizzante:'concimazione',biostimolante:'biostimolazione'}[product?.type])||({meccanico:'meccanica',mechanic:'meccanica',trattamento:'concimazione'}[n.type])||'concimazione');
  if(opStatus(n)===OP_STATUS.ESEGUITA)n.status='completato';
  return n;
}
function validateAndConfirmOp(newEv,onReject=message=>alert(message)){
  try{
    const wxr=window.__LAWNLY_WX__||null,td=wxr?.todayData||{};
    const wx=wxr?{tmax:td.tmax??null,tmin:td.tmin??null,humidity:td.humidity??null}:null;
    const prof=S.get('dss_profile',{})||{};
    const evs=readCalendarEvents().filter(e=>!isOpSkipped(e)).map(prepareCalendarOperation);
    const v=validateOperation(newEv,evs,window.__LAWNLY_CATALOG__||[],wx,prof.grassMixture||'microterme');
    if(!newEv.week||!Number.isFinite(Date.parse(newEv.date||newEv.dt)))v.errors.push('Data o settimana dell’operazione non valida.');
    if(v.errors.length){onReject(v.errors.join('\n'));return false;}
    if(v.warnings.length&&!confirm('⚠ Attenzione agronomica:\n\n'+v.warnings.join('\n\n')+'\n\nProcedere comunque?')){onReject('Operazione non confermata: '+v.warnings.join(' '));return false;}
    return true;
  }catch(e){onReject('Validazione non riuscita: '+e.message);return false;}
}
function operationQuantity(op){
  const doses=(op.doses||[]).filter(d=>Number(String(d.amount).replace(',','.'))>0);
  if(doses.length)return doses.reduce((sum,d)=>addQuantity(sum,{qty:d.amount,unit:d.unit||op.unit}),{qty:0,unit:doses[0].unit||op.unit});
  if(Number(String(op.quantityTotal).replace(',','.'))>0)return addQuantity({qty:0,unit:op.unit},{qty:op.quantityTotal,unit:op.unit});
  return null;
}
function restoreOperationStock(products,consumed){
  return products.map(p=>({...p,packages:p.packages.map(pk=>{
    const entries=(consumed||[]).filter(c=>c.productId===p.id&&c.pkg_id===pk.id);
    if(!entries.length)return pk;
    const unit=whPackageUnit(p,pk);
    return{...pk,unit,remaining_qty:entries.reduce((q,c)=>addQuantity(q,{qty:c.used,unit:c.unit}),{qty:pk.remaining_qty||0,unit}).qty};
  })}));
}
function applyCalendarOperation(operation,{source='manual',remove=false,undo=false,onReject=message=>alert(message)}={}){
  const evs=S.get('dss_calendar_events',[])||[];
  const previous=evs.find(e=>e&&e.id===operation.id)||null;
  let n=undo?previous?.chatUndo?.before:operation;
  if(undo&&!previous?.chatUndo)return{ok:false,reason:'Operazione non più annullabile.'};
  remove=remove||(undo&&!n);
  if(!remove){
    const input=undo?{...n}:{...previous,...n};
    if(!undo&&previous&&input.week!==previous.week&&input.date===previous.date){delete input.date;delete input.dt;delete input.month;}
    if(!undo&&operation.status&&_LEGACY_STATUS_MAP[operation.status]!==OP_STATUS.ESEGUITA){input.done=false;input.completed=false;input.confirmed=false;}
    n=prepareCalendarOperation(input);
    let reason='';
    if(!undo&&!validateAndConfirmOp(n,message=>{reason=message;onReject(message);}))return{ok:false,reason};
  }
  let products=whProducts(),stockChanged=false;
  const wasDone=previous&&opStatus(previous)===OP_STATUS.ESEGUITA;
  const done=!remove&&opStatus(n)===OP_STATUS.ESEGUITA;
  if(wasDone&&(!done||remove)&&previous.consumed?.length){products=restoreOperationStock(products,previous.consumed);stockChanged=true;}
  if(!remove&&done&&!wasDone){
    n={...n,consumed:[],shortfall:0,stockWarning:null};
    try{
      const quantity=operationQuantity(n);
      if(quantity){
        const pid=n.finalProductId||n.suggestedProductId;
        const needle=String(n.product||n.name).toLowerCase().trim();
        const matches=products.filter(p=>pid?(p.id===pid||p.productId===pid):[p.name,((p.brand||'')+' '+p.name).trim()].some(v=>String(v).toLowerCase()===needle));
        let remaining=Number(String(quantity.qty).replace(',','.'));n.stockUnit=quantity.unit;
        // Vecchie righe duplicate dello stesso prodotto: FIFO anche fra acquisti separati.
        const compatible=matches.filter(p=>{try{addQuantity({qty:0,unit:quantity.unit},{qty:whTotal(p),unit:p.unit});return true;}catch(e){return false;}}).sort((a,b)=>String(a.packages[0]?.added_date||'').localeCompare(String(b.packages[0]?.added_date||'')));
        for(const p of compatible){
          if(remaining<=0)break;
          const result=wfFifoUse(products,p.id,remaining,quantity.unit);
          products=result.products;remaining=Math.max(0,remaining-result.used);
          n.consumed.push(...result.consumed);stockChanged=stockChanged||result.used>0;
        }
        n.shortfall=remaining;
        if(remaining>0)n.stockWarning='Magazzino: mancano '+remaining+' '+quantity.unit+(matches.length&&!compatible.length?' (giacenza in unità incompatibili, anche confezioni).':'.');
      }else if(n.product||n.finalProductId)n.stockWarning='Magazzino non scaricato: manca una quantità con unità esplicita.';
    }catch(e){onReject(e.message);return{ok:false,reason:e.message};}
  }
  if(!remove){
    if(!done&&!undo){n={...n,confirmed:false,done:false,completed:false,consumed:[],shortfall:0,stockWarning:null};}
    if(source==='chat')n={...n,from_chat:true,chatUndo:previous?.chatUndo||{before:previous?{...previous,chatUndo:undefined}:null}};
    if(undo){n={...n,chatUndo:undefined};}
    if(source!=='chat'&&!undo)delete n.chatUndo;
    n.updatedAt=new Date().toISOString();
  }
  if(stockChanged)S.set('dss_warehouse_v2',products);
  if(wasDone&&(!done||remove))S.set('dss_warehouse_log',(S.get('dss_warehouse_log',[])||[]).filter(l=>l.operationId!==previous.id));
  const next=remove?evs.filter(e=>e.id!==operation.id):previous?evs.map(e=>e.id===previous.id?n:e):[...evs,n];
  S.set('dss_calendar_events',next);
  if(!remove&&!wasDone&&n.consumed?.length)for(const c of n.consumed)whLogUse(c.productId,c.productName,c.unit,c.used,n.name,n.id);
  try{window.dispatchEvent(new CustomEvent('lawnly:sync'));}catch(e){}
  return{ok:true,operation:n,events:next};
}
// Anche rigenerazioni e modifiche a liste passano dall'ingresso applicativo.
function saveCalendarEvents(next){
  const before=S.get('dss_calendar_events',[])||[];
  let ok=true;
  for(const op of next.filter(Boolean)){
    const old=before.find(e=>e.id===op.id);
    if(old&&JSON.stringify(old)===JSON.stringify(op))continue;
    if(!applyCalendarOperation(op).ok)ok=false;
  }
  if(ok)for(const old of before)if(!next.some(e=>e&&e.id===old.id))applyCalendarOperation(old,{remove:true});
  return ok;
}
function applyChatCalendarOperation(op){
  const n=prepareCalendarOperation(op);
  const bn=name=>String(name||'').toLowerCase().replace(/[^a-z0-9\s]/gi,' ').trim().split(/\s+/).slice(0,2).join(' ');
  const similar=e=>{const a=bn(n.name),b=bn(e.name);return e.year===n.year&&Math.abs(e.week-n.week)<=2&&a&&b&&(a===b||a.includes(b)||b.includes(a));};
  const evs=readCalendarEvents().map(prepareCalendarOperation);
  const match=evs.find(e=>e.id===op.id)||evs.find(e=>isOpOpen(e)&&similar(e))||evs.find(similar);
  // I campi della proposta integrano quelli del piano (dosi, prodotto e zone inclusi).
  const candidate=match?{...match,...op,id:match.id}:n;
  return applyCalendarOperation(candidate,{source:'chat',onReject:()=>{}});
}

function parseGardenInsights(text){
  const clean=String(text||'').replace(/\r/g,'').trim();
  if(!clean)return{summary:'',criticalPoints:[],actions:[]};
  const lines=clean.split('\n').map(l=>l.trim()).filter(Boolean);
  const bullets=lines.filter(l=>/^[-•*]\s+/.test(l)).map(l=>l.replace(/^[-•*]\s+/,''));
  return{
    summary:lines.slice(0,3).join(' ').slice(0,260),
    criticalPoints:bullets.slice(0,5),
    actions:bullets.slice(0,3)
  };
}
function buildGardenOpCandidates(parsed,doc){
  const src=[...(parsed?.actions||[]),...(parsed?.criticalPoints||[])].filter(Boolean).slice(0,3);
  const inferPriority=(txt)=>{
    const t=String(txt||'').toLowerCase();
    if(/urgente|immediat|subito|critic|fung|larv|parassit|marci|ristagno|malatt|stress/i.test(t))return'high';
    if(/monitor|verifica|controll|attenzion|riduci|aumenta|regola/i.test(t))return'medium';
    return'low';
  };
  return src.map((txt,i)=>({
    id:'gop_'+Date.now()+'_'+i,
    sourceDocId:doc?.id||null,
    sourceDocName:doc?.name||'Documento giardino',
    title:'Intervento da insight giardino',
    note:txt,
    priority:inferPriority(txt),
    type:'defense',
    createdAt:new Date().toISOString()
  }));
}

/* ── Sistema Dottor Verde ── */
const DOTTOR_VERDE=`Sei il Dottor Verde, agronomo AI integrato nell'app Lawnly. Hai accesso a tutti i dati reali del giardino dell'utente: meteo, GDD, calendario, irrigazione, suolo, magazzino, foto zone.

COME RISPONDERE — REGOLE ASSOLUTE:

1. PRIMA DI RISPONDERE, se la domanda è vaga o ha più interpretazioni, fai UNA sola domanda di chiarimento con 2-3 opzioni a scelta rapida. Formato:
   "Per darti la risposta giusta, dimmi:
   A) [opzione]
   B) [opzione]
   C) [opzione]"
   Poi aspetta la risposta dell'utente prima di continuare.

2. RISPOSTE BREVI: max 4-5 frasi oppure max 3 azioni numerate. Se serve più spazio, chiedi prima conferma ("vuoi i dettagli?").

3. FORMATO PLAIN TEXT: zero markdown (no ##, no **, no ---). Usa solo testo normale. Per le liste usa "1. 2. 3." o "A) B) C)". Nessun altro simbolo decorativo.

4. CONCRETEZZA: ogni risposta deve contenere almeno un'azione precisa (cosa fare, quando, quanto). No teorie, no spiegazioni accademiche salvo richiesta.

5. PRODOTTI: cita solo prodotti presenti nel magazzino dell'utente. Se il magazzino è vuoto o il prodotto non c'è, dillo in una frase e suggerisci l'alternativa più semplice.

6. TONO: conversazionale, diretto. Parla come un agronomo amico che conosce bene il tuo prato — non come un manuale tecnico.

FILOSOFIA DI INTERVENTO — REGOLA FONDAMENTALE:
"Meno è meglio" è il principio cardine di ogni agronomo professionale. Un prato sovra-trattato subisce danni peggiori di uno sotto-trattato. Prima di suggerire qualsiasi intervento, chiediti: è davvero necessario ORA?

PRINCIPI ASSOLUTI (mai derogabili):
1. NON recuperare mai i trattamenti saltati. Se l'utente non ha fatto nulla in primavera e ora è giugno, NON suggerire di fare tutto adesso per "recuperare". Quello che non si è fatto rimane non fatto. Si parte da dove si è oggi, con ciò che serve oggi.
2. MASSIMO 1 intervento ogni 2 settimane in estate (giugno-agosto). Il prato è sotto stress — ogni intervento aggiuntivo è un rischio.
3. PRIORITÀ sequenziale — risolvi sempre nell'ordine: (A) stress idrico → (B) stress termico → (C) nutrizione → (D) difesa fitosanitaria. Non passare al punto successivo se il precedente non è risolto.
4. Per un prato fermo da mesi che affronta l'estate: consiglia SOLO ciò che aiuta la sopravvivenza estiva. Tipicamente: 1 potassio (Summer K o simile, dose ridotta 25-30g/m²) + eventuale biostimolante liquido (Always, Pre-Stress) se c'è rischio termico. Stop.
5. In estate (T>28°C): ZERO azoto. ZERO lavorazioni meccaniche. ZERO fungicidi preventivi se non c'è sintomatologia visibile.

CONOSCENZA TECNICA:
- Microterme (Festuca, Lolium, Poa): base GDD 5°C, crescita ottimale 15-24°C. Dormienza parziale sopra 30°C.
- Macroterme (Cynodon, Zoysia): base GDD 10°C, crescita ottimale 27-35°C.
- ETo Hargreaves-Samani, rischio fungino (T>15°C + umidità>80%), finestra FLY GDD 200-500
- Distanze minime tra interventi: azoto granulare slow-release = 8 settimane; biostimolanti fogliari = 2-3 settimane; fungicidi = 3-4 settimane; potassio puro = 4 settimane.
- COMBINAZIONI sicure: azoto + biostimolante radicale OK; potassio + biostimolante fogliare OK; VIETATO: fungicida + biostimolante fogliare insieme (interferenza); VIETATO: due azotati a distanza < 4 settimane.
- ARIEGGIATURA/VERTICUT/SCARIFICATURA: VIETATO in estate (giugno-agosto) e inverno (dicembre-febbraio). Finestre: aprile-maggio oppure settembre-ottobre.

Basa ogni risposta sui dati reali disponibili. Non inventare dati — chiedili all'utente.

FILOSOFIA CORE — RAGIONAMENTO CONTESTUALE (non regole statiche):
Questa app NON usa calendari fissi. Ogni consiglio deriva dalle variabili reali del giardino:
1. GDD attuale vs norma storica → stagione in anticipo/ritardo biologico
2. Trend termico 7gg → dove sta andando il clima
3. Storico trattamenti → timing e gap tra interventi
4. Diagnosi + suolo + foto → priorità reali
Non dire "a giugno si fa X" — di' "con GDD Y e trend Z, ora è il momento giusto/sbagliato per X perché...".
L'utente può fare scelte autonome — valuta SE sono corrette e suggerisci cosa fare DOPO come conseguenza.

PROTOCOLLO PRIMO AVVIO (calendario vuoto, nessuna operazione presente):
Se il calendario è vuoto e l'utente non ha ancora raccontato cosa ha fatto, segui QUESTO ordine esatto:
1. Chiedi: "Cosa hai già fatto sul prato quest'anno? Dimmi i trattamenti, le lavorazioni meccaniche e i prodotti usati, con i mesi approssimativi."
2. Registra SOLO quello che l'utente descrive come già fatto → CALENDAR_UPDATE con status:"completato"
3. DOPO aver registrato lo storico, analizza i gap e chiedi: "Vuoi che ti suggerisca cosa fare da oggi in avanti?"
4. Se sì → genera suggerimenti SOLO per settimane >= settimana corrente, basati su: cosa è già stato fatto, GDD attuale, stagione, condizioni meteo
5. NON suggerire mai di "recuperare" trattamenti saltati — parti dalla situazione attuale

SEPARAZIONE NETTA storico/futuro:
- Se registri storico → tutto status:"completato", tutte settimane passate
- Se suggerisci il futuro → descrivi a PAROLE e chiedi conferma. NON inserire nulla prima della conferma.
- QUANDO L'UTENTE CONFERMA (anche solo "sì", "ok", "procedi", "aggiorna"): DEVI emettere il blocco
  CALENDAR_UPDATE con le operazioni proposte, settimane >= corrente e status:"programmato".
  Rispondere "ho aggiornato il piano" senza emettere il blocco NON aggiorna niente: è l'errore da non fare mai.
  Alla conferma NON fare altre domande e non rimandare: emetti subito il blocco con le operazioni che hai
  appena descritto, usando i dati che hai. Se ti manca un dettaglio, scegli l'ipotesi più prudente e scrivila
  nelle note dell'operazione.
- ANNO: il campo "year" è SEMPRE l'anno corrente indicato in CONTESTO PRATO ATTIVO. Non usare mai un anno diverso.

REGOLE CALENDARIO — IRRIGAZIONE:
- L'irrigazione NON è mai un'operazione standalone nel calendario. VIETATO creare eventi "Irrigazione settimanale" come voci separate.
- L'irrigazione appare SOLO come nota all'interno di un trattamento che la richiede (es. "Dopo concimazione irrigare 15-20 min per attivare il prodotto").
- Se l'utente chiede "aggiungi irrigazione in calendario", spiega che si gestisce nella sezione Irrigazione, non nel calendario operativo.

PROTOCOLLO AGGIORNAMENTO CALENDARIO — OBBLIGATORIO:
Quando l'utente racconta operazioni già eseguite, DEVI emettere ESATTAMENTE questo blocco come ULTIMA RIGA della risposta (senza markdown, senza newline nel JSON):
CALENDAR_UPDATE:[{"week":N,"year":YYYY,"name":"Nome operazione","type":"trattamento","status":"completato","notes":""}]
⚠️ VIETATO: dire "ho registrato nel calendario" o "ho aggiornato il calendario" senza emettere il blocco CALENDAR_UPDATE. L'app NON può registrare nulla senza quel blocco.

REGOLE TASSATIVE PER CALENDAR_UPDATE — storico operazioni:
1. COMBINAZIONI: se l'utente ha applicato più prodotti INSIEME nella stessa sessione → UNA sola voce con nome combinato (es. "Humic + Mico Power"), MAI voci separate per ogni prodotto
2. SE NON SEI SICURO del nome esatto del prodotto usato → CHIEDI prima di registrare. Non inventare nomi di prodotto.
3. STORICO vs PIANO: il blocco dello storico contiene SOLO operazioni già eseguite (status:"completato"). Le operazioni future si emettono in un blocco a parte, dopo la conferma dell'utente, con status:"programmato".
4. NO DUPLICATI: prima di registrare, considera che il calendario potrebbe già avere quell'operazione. Se il nome è già presente nella stessa settimana, segnalalo invece di crearne un secondo.
5. SUGGERIMENTI FUTURI separati: se dopo aver registrato lo storico vuoi suggerire cosa fare ora, descrivilo a parole — NON includerlo nel CALENDAR_UPDATE storico. Appena l'utente conferma, emetti il blocco con status:"programmato".`;

/* ── Dottor Verde indicatori-first (Step 10.4) ───────────────────────
   Versione del system prompt che parte dagli INDICATORI CLIMATICI invece
   che da mesi/stagioni. Affiancato a DOTTOR_VERDE (legacy) — quest'ultimo
   resta usato altrove per retrocompatibilità.
   Nota: implementato come FUNZIONE (non const template literal) perché
   le variabili `indicators/rules/profile/zones/soil` non sono disponibili
   a module-level. */
function buildAgroSystemPrompt({indicators,rules,profile,zones,soil,userTraits}){
  const traits = userTraits || profile?.userTraits || USER_TRAITS_DEFAULTS;
  const traitsBlock = `\nPROFILO UTENTE STICKY (NON IGNORARE — questi tratti sono permanenti, raccolti in onboarding):
- Livello manutenzione desiderato: ${traits.mnt || 'non specificato'}
- Tempo disponibile: ${traits.tempo || 'non specificato'}
- Utilizzo del prato: ${(traits.utilizzo || []).join(', ') || 'non specificato'}
- Aspetto rilevato: ${(traits.aspetto || []).join(', ') || 'non specificato'}
- Problemi noti: ${(traits.problemi || []).join(', ') || 'nessuno noto'}
- Tipo suolo: ${traits.soilType || 'loam'}
- Impianto irrigazione: ${traits.hasIrrigation ? (traits.irrigationType || 'presente') : 'assente'}

REGOLA OPERATIVA: usa questi tratti per personalizzare ogni risposta. Esempio: se utilizzo include "Bambini" o "Animali", evita prodotti tossici e indicalo esplicitamente. Se "Calpestio intenso", consiglia mix più resistenti, eviterà programmazione di operazioni che richiedono giorni di "no traffico". Se tempo = "1h/settimana", suggerisci sempre la versione più semplice di ogni operazione.\n`;
  // Converti indicatori in testo compatto invece di JSON verboso
  const indStr=indicators?Object.entries(indicators).filter(([,v])=>v!=null&&v!==false&&v!=='').map(([k,v])=>`${k}=${typeof v==='number'?v.toFixed(2):v}`).join(' · '):'n.d.';
  const rulesStr=rules?Object.entries(rules).filter(([,v])=>v!=null&&v!==false&&v!=='').map(([k,v])=>`${k}:${v}`).join(' · '):'n.d.';
  return `INDICATORI CLIMATICI: ${indStr}
REGOLE OPERATIVE: ${rulesStr}
${traitsBlock}
FLUSSO OBBLIGATORIO se calendario vuoto:
1. Chiedi cosa è già stato fatto quest'anno → registra solo quello (CALENDAR_UPDATE status:completato)
2. Poi suggerisci cosa fare da oggi → solo a parole, poi chiedi conferma prima di inserire
MAI mescolare storico e suggerimenti futuri nello stesso CALENDAR_UPDATE.
REGOLA: "Meno è meglio." Non recuperare trattamenti saltati. Parti dalla situazione di oggi.
ESTATE (giu-ago): max 1 intervento/2 settimane. Zero azoto T>28°C. Zero meccaniche.
OPERATIVO: stressHeat>0.7→no azoto. fusariumRisk>=3→fungicida. rainNext7d>40mm→rinvia granulari.

CONTESTO GIARDINO: ${profile.gardenName||'—'} · ${profile.city||'—'} · ${profile.totalArea||'?'}m² · zone: ${zones.map(z=>z.name+'('+z.area+'m²)').join(', ')}${soil?` · suolo pH ${soil.ph||'—'}`:''}

RISPOSTA IN ITALIANO. BREVE. CONCISA. PRATICA. Niente teorie, niente papiri.`;
}

function AuthScreen({onAuth}){

  const [showPass,setShowPass]=useState(false);const [showPass2,setShowPass2]=useState(false);
  const [code,setCode]=useState('');const [terms,setTerms]=useState(false);

  const submit=async()=>{
    if(mode==='reset'){
      if(!code.trim()||pass.length<8){setErr('Inserisci il codice ricevuto e una nuova password di almeno 8 caratteri.');return;}
      setLoading(true);setErr('');setInfo('');
      const res=await supa.auth.resetConfirm(email.trim(),code.trim(),pass);
      setLoading(false);
      if(res.error){setErr(res.error.message);return;}
      onAuth(res.data.user,res.data.session);return;
    }
    if(!email.trim()||!pass.trim()){setErr('Inserisci email e password.');return;}
    if(mode==='register'&&pass!==pass2){setErr('Le password non coincidono.');return;}
    if(mode==='register'&&pass.length<8){setErr('Password minimo 8 caratteri.');return;}
    if(mode==='register'&&!terms){setErr('Per registrarti accetta i Termini di servizio e l\'Informativa privacy.');return;}
    setLoading(true);setErr('');setInfo('');
    if(!supa){
      // Modalità offline (senza Supabase) — login locale
      const fakeUser={id:'local_'+email,email,local:true};
      onAuth(fakeUser,null);setLoading(false);return;
    }
    try{
      let res;
      if(mode==='login'){res=await supa.auth.signInWithPassword({email:email.trim(),password:pass});}
      else{res=await supa.auth.signUp({email:email.trim(),password:pass});}
      if(res.error)throw new Error(res.error.message);
      if(mode==='register'&&!res.data.session){setInfo('Controlla la tua email e clicca il link di conferma.');setLoading(false);return;}
      onAuth(res.data.user,res.data.session);
    }catch(e){setErr(e.message.replace('Invalid login credentials','Email o password non corretti.').replace('User already registered','Email già registrata. Usa il login.'));}
    setLoading(false);
  };

  const forgotPwd=async()=>{
    if(!email.trim()){setErr('Inserisci la tua email prima.');return;}
    setLoading(true);setErr('');setInfo('');
    const{error}=await supa.auth.resetPasswordForEmail(email.trim());
    setLoading(false);
    if(error){setErr(error.message);return;}

          ${info?html`<div style="background:var(--green-soft);border:1px solid rgba(76,140,63,.28);border-radius:12px;padding:11px 13px;font-size:12.5px;color:var(--green-deep);margin-top:14px;font-weight:600;line-height:1.4;">${info}</div>`:''}

          <button class="sh-save" onClick=${submit} disabled=${loading} style=${'margin-top:18px;'+(loading?'opacity:.6;cursor:default;':'')}>
            ${loading?html`<${Spin}/> Attendere...`:mode==='login'?'Accedi →':'Crea account →'}
          </button>

          ${mode==='login'?html`<button onClick=${forgotPwd} style="width:100%;margin-top:12px;background:none;border:none;font-size:12.5px;color:var(--t3);cursor:pointer;padding:6px;font-weight:600;font-family:inherit;">Password dimenticata?</button>`:''}

          ${!supa?html`<div style="margin-top:14px;padding:11px 12px;background:var(--amber-soft);border:1px solid rgba(222,142,44,.22);border-radius:12px;font-size:11.5px;color:var(--amber-deep);text-align:center;line-height:1.5;font-weight:600;">⚠️ Modalità offline — i dati restano solo su questo dispositivo.</div>`:''}
        </div>

        <div style="text-align:center;margin-top:18px;font-size:11.5px;color:var(--t4);font-weight:500;">🔒 I tuoi dati sono protetti e accessibili solo da te<div style="margin-top:6px;"><a href="#" onClick=${e=>{e.preventDefault();lawnlyOpenLegal('privacy.html');}} style="color:var(--t3);">Privacy</a> · <a href="#" onClick=${e=>{e.preventDefault();lawnlyOpenLegal('termini.html');}} style="color:var(--t3);">Termini</a></div></div>
      </div>
    </div>
  </div>`;
}

/* ═══════════════════════════════════════════════════════
   ONBOARDING — 6 step (nessuna chiave API all'utente)
═══════════════════════════════════════════════════════ */
const OB_STEPS=[
  {id:'language', title:'Benvenuto 🌿',          sub:'Scegli la tua lingua'},
  {id:'garden',   title:'Il tuo giardino',        sub:'Nome e dimensioni'},
  {id:'location', title:'Posizione',               sub:'Dove si trova il tuo giardino?'},
  {id:'grass',    title:'Tipo di prato',           sub:'Microterme, Macroterme o Personalizzato?'},
  {id:'zones',    title:'Zone del giardino',       sub:'Configura le aree di gestione'},
  {id:'audience', title:'Come gestisci il tuo prato?', sub:'Scegli il livello che ti rispecchia. Potrai cambiarlo dopo dal Profilo.'},
  {id:'diagnosis',title:'Diagnosi del prato 🔬', sub:'Il Dottor Verde analizzerà il tuo prato e creerà il piano annuale'},
];

function DiagnosisStep({form,zones,onComplete}){
  const [mnt,setMnt]=useState(null);
  const [multi,setMulti]=useState({});
  const [showDetails,setShowDetails]=useState(false);
  const [photos,setPhotos]=useState({});
  const [uploading,setUploading]=useState(null);
  const [analyzing,setAnalyzing]=useState(false);
  const [showSlowHint,setShowSlowHint]=useState(false);
  const [progress,setProgress]=useState('');
  const [err,setErr]=useState('');
  const [irrType,setIrrType]=useState(()=>form.irrigationType ?? null);
  const [flowRate,setFlowRate]=useState(()=>form.flowRateLpm ?? null);
  const [soilType,setSoilType]=useState(()=>(form.soilType&&['sandy-loam','loam','silt-loam','clay-loam'].includes(form.soilType)?form.soilType:'unknown'));
  const [lastIrr,setLastIrr]=useState(()=>(form.lastIrrigation&&['today','yesterday','2-3days','week','more'].includes(form.lastIrrigation)?form.lastIrrigation:'skip'));
  const [showSoilGuide,setShowSoilGuide]=useState(false);
  const [irr,setIrr]=useState(()=>{
    if(form.hasIrrigation===true)return'automatica';
    if(form.hasIrrigation===false&&(form.irrigationType||form.flowRateLpm))return'automatica';
    if(form.hasIrrigation===false)return'manuale';
    return null;
  });

  useEffect(()=>{
    if(!analyzing){setShowSlowHint(false);return;}
    setShowSlowHint(false);
    const t=setTimeout(()=>setShowSlowHint(true),3000);
    return()=>clearTimeout(t);
  },[analyzing]);

  const selBtn=on=>`padding:10px;border-radius:8px;border:2px solid ${on?'var(--green)':'var(--border)'};background:${on?'var(--green-l)':'#fff'};cursor:pointer;font-size:11px;font-weight:600;text-align:center;width:100%;box-sizing:border-box`;
  const selBtnGrid=active=>'display:flex;flex-direction:column;align-items:center;text-align:center;padding:10px 6px;border-radius:.9rem;gap:4px;cursor:pointer;border:2px solid '+(active?'var(--green)':'var(--border)')+';background:'+(active?'var(--green-l)':'#fff');
  const selBtnSmall=active=>'padding:6px 8px;border-radius:6px;cursor:pointer;border:1px solid '+(active?'var(--green)':'var(--border)')+';background:'+(active?'var(--green-l)':'#fff')+';font-size:12px';

  const toggleMulti=(gid,val,single)=>{
    if(single){setMulti(p=>({...p,[gid]:(p[gid]||[])[0]===val?[]:[val]}));return;}
    setMulti(p=>{const c=p[gid]||[];return{...p,[gid]:c.includes(val)?c.filter(v=>v!==val):[...c,val]};});
  };
  const handlePhoto=async(zoneId,file)=>{
    if(!file||(photos[zoneId]||[]).length>=2)return;
    setUploading(zoneId);
    try{const sh=await shrinkImageFile(file);setPhotos(p=>({...p,[zoneId]:[...(p[zoneId]||[]),{id:Date.now(),b64:sh.b64,mediaType:sh.mediaType,name:file.name}]}));}
    catch{}setUploading(null);
  };
  const removePhoto=(zoneId,pid)=>setPhotos(p=>({...p,[zoneId]:(p[zoneId]||[]).filter(ph=>ph.id!==pid)}));
  const canAnalyze=irr&&mnt;

  const persistOnboardingPhotos=async()=>{
    if(!photos||Object.keys(photos).length===0)return;
    try{
      const existing={};
      const nowIso=new Date().toISOString();
      Object.entries(photos).forEach(([zoneId,photoArr])=>{
        if(!Array.isArray(photoArr)||photoArr.length===0)return;
        const zoneArr=existing[zoneId]||[];
        photoArr.forEach(p=>{
          if(!p||!p.b64)return;
          const b64Data=String(p.b64).startsWith('data:')?p.b64:('data:image/jpeg;base64,'+p.b64);
          zoneArr.push({
            id:p.id!=null?p.id:(Date.now()+Math.random()),
            b64:b64Data,
            name:p.name||'foto-onboarding.jpg',
            dt:nowIso,
            uploadedAt:nowIso,
            source:'onboarding-step7'
          });
        });
        existing[zoneId]=zoneArr;
      });
      await addZonePhotos(existing);
      console.log('[Diagnosis] persisted',Object.keys(photos).length,'zone(s) photos to dss_zone_photos');
    }catch(e){throw e;}
  };

  const analyze=async()=>{
    console.log('[Diagnosis] === START analyze ===',new Date().toISOString());
    setAnalyzing(true);setErr('');setProgress('Avvio analisi...');

    // Triple Safety Net: timeout ASSOLUTO 12s che forza completamento
    let alreadyCompleted=false;
    const completeOnce=async(payload,source)=>{
      if(alreadyCompleted){console.log('[Diagnosis] completeOnce: already done, skip');return;}
      alreadyCompleted=true;
      console.log('[Diagnosis] === COMPLETE via',source,'===');
      try{await persistOnboardingPhotos();}catch(e){alreadyCompleted=false;setAnalyzing(false);setErr('Foto non salvate: '+e.message);return;}
      const fullPayload={
        ...payload,
        soilType: soilType === 'unknown' ? 'loam' : soilType,
        lastIrrigation: lastIrr === 'skip' ? null : lastIrr,
        irrigationSetup:{
          hasIrrigation:irr==='automatica',
          irrigationType:irr==='automatica'?irrType:null,
          flowRateLpm:irr==='automatica'?flowRate:null
        }
      };
      try{S.set('dss_diagnosis_data',fullPayload);}catch(e){console.warn('[Diagnosis] save failed:',e.message);}
      try{onComplete(fullPayload);}catch(e){console.error('[Diagnosis] onComplete error:',e.message);}

      /* PATCH v8.0 — Background: enrich foto onboarding con AI vision + rigenera stato_generale
         integrato. Non blocca onComplete (utente vede Dashboard subito). Quando le analisi sono
         pronte (5-20s), aggiorna dss_diagnosis_data.analisi e dispatcha lawnly:sync per refresh UI. */
      (async () => {
        try {
          console.log('[Lawnly v8.0] background diagnosis integration START');
          const photoAnalyses = await enrichOnboardingPhotosWithAI();
          const profile = S.get('dss_profile', {}) || {};
          const integrated = await generateIntegratedDiagnosis(form, multi, photoAnalyses, profile);
          if (integrated) {
            const curr = S.get('dss_diagnosis_data', null);
            if (curr) {
              curr.analisi = {
                ...(curr.analisi || {}),
                ...(integrated.stato_generale ? { stato_generale: integrated.stato_generale } : {}),
                ...(integrated.problemi && integrated.problemi.length ? { problemi: integrated.problemi } : {}),
                ...(integrated.operazione_top ? { operazione_top: integrated.operazione_top } : {}),
                ...(integrated.operazione_top_nota ? { operazione_top_nota: integrated.operazione_top_nota } : {}),
                ...(typeof integrated.salute_score === 'number' ? { salute_score: integrated.salute_score } : {})
              };
              curr.integratedDiagnosis = integrated;
              S.set('dss_diagnosis_data', curr);
              try { window.dispatchEvent(new CustomEvent('lawnly:sync')); } catch {}
              console.log('[Lawnly v8.0] background diagnosis integration DONE — photoCount='+integrated.photoCount+' score='+integrated.salute_score);
            }
          } else {
            console.log('[Lawnly v8.0] background diagnosis: no integrated result, placeholder mantained');
          }
        } catch (e) {
          console.warn('[Lawnly v8.0] background integration failed:', e.message);
        }
      })();
    };

    const buildFallbackPayload=(reason)=>{
      let ops=[];
      try{
        const gardenData={...form,zones:form.zones};
        const profile=S.get('dss_profile',{})||{audienceLevel:form.audienceLevel};
        ops=generateFallbackPlan(gardenData,profile)||[];
      }catch(e){
        console.warn('[Diagnosis] fallback plan generation failed:',e.message);
        ops=[];
      }
      return{
        irrigazione:irr,manutenzione:mnt,selezioni:multi,
        analisi:{
          stato_generale:'Piano generato in modalita base ('+reason+')',
          salute_score:60,
          problemi:[],
          operazione_top:'Conferma il calendario per iniziare',
          operazione_top_nota:'',
          piano_nutrizione:'',
          note_agronomiche:'Il Dottor Verde raffinera il piano alle prossime aperture.',
          operazioni_consigliate:ops
        },
        gddAtSetup:null,
        generatedAt:new Date().toISOString(),
        planSource:reason
      };
    };

    // ASSOLUTE TIMEOUT 12s: garantisce che l'analisi finisca SEMPRE
    const absoluteTimeout=setTimeout(()=>{
      console.warn('[Diagnosis] ABSOLUTE TIMEOUT 12s reached, forcing fallback');
      completeOnce(buildFallbackPayload('absolute-timeout-12s'),'absolute-timeout');
    },12000);

    try{
      // === STEP A: loadWxCached con timeout 5s ===
      let wxData=null;
      if(form.lat&&form.lon){
        setProgress('Caricamento dati climatici...');
        console.log('[Diagnosis] loading wx for',form.lat,form.lon);
        try{
          wxData=await Promise.race([
            loadWxCached(form.lat,form.lon,new Date().getFullYear(),form.gddBase||5,form.timezone||'Europe/Rome',form.grassMixture||'microterme'),
            new Promise((_,rej)=>setTimeout(()=>rej(new Error('WX_TIMEOUT_5S')),5000))
          ]);
          console.log('[Diagnosis] wx loaded OK');
        }catch(e){
          console.warn('[Diagnosis] wx load failed/timeout:',e.message);
          wxData=null;
        }
      }

      if(alreadyCompleted){clearTimeout(absoluteTimeout);return;}

      // === STEP B: calendario parte vuoto — il piano viene costruito dal Dottor Verde in chat ===
      // NON generiamo più un piano automatico all'onboarding: l'utente racconta a DV cosa ha
      // già fatto, DV registra lo storico e suggerisce solo cosa fare da oggi in avanti.
      const ops=[];
      const usedFallback=false;
      console.log('[Diagnosis] calendar starts empty — DV will build plan from chat');

      if(alreadyCompleted){clearTimeout(absoluteTimeout);return;}

      // === STEP C: build payload e completa ===
      clearTimeout(absoluteTimeout);
      try{saveCalendarEvents(ops);}catch(e){}
      const payload={
        irrigazione:irr,manutenzione:mnt,selezioni:multi,
        analisi:usedFallback?{
          stato_generale:'Piano generato in modalita base',
          salute_score:60,
          problemi:[],
          operazione_top:'Conferma il calendario per iniziare',
          operazione_top_nota:'',
          piano_nutrizione:'',
          note_agronomiche:'Il Dottor Verde raffinera il piano alle prossime aperture.',
          operazioni_consigliate:ops
        }:{
          stato_generale:'Piano generato dal Dottor Verde',
          salute_score:70,
          problemi:[],
          operazione_top:ops[0]?.name||'',
          operazione_top_nota:ops[0]?.rationale||ops[0]?.notes||'',
          piano_nutrizione:'',
          note_agronomiche:'',
          operazioni_consigliate:ops
        },
        gddAtSetup:wxData?.gddTotal||null,
        generatedAt:new Date().toISOString(),
        planSource:usedFallback?'fallback':(ops[0]?._source||'unknown')
      };
      completeOnce(payload,usedFallback?'fallback':'ai-success');

      // Background refine se fallback
      if(usedFallback){
        setTimeout(()=>{
          try{
            const gardenData={...form,zones:form.zones};
            const profile=S.get('dss_profile',{})||{audienceLevel:form.audienceLevel};
            generateAnnualPlan(
              {gardenData,profile,weather:wxData,diagnosisInputs:{irr,mnt,multi}},
              {maxTokens:4000,useHaiku:false,timeoutMs:45000,backgroundRefine:true}
            ).then(newOps=>{if(newOps&&newOps.length)saveCalendarEvents(newOps);})
            .catch(e=>console.warn('[bg-refine]',e.message));
          }catch(e){}
        },2000);
      }
    }catch(e){
      console.error('[Diagnosis] outer error:',e.message);
      clearTimeout(absoluteTimeout);
      completeOnce(buildFallbackPayload('outer-exception'),'outer-exception');
    }
  };

  const skipDiagnosis=async()=>{
    console.log('[Diagnosis] User clicked SKIP');
    setAnalyzing(false);
    try{await persistOnboardingPhotos();}catch(e){setErr('Foto non salvate: '+e.message);return;}
    let ops=[];
    try{
      const gardenData={...form,zones:form.zones};
      const profile=S.get('dss_profile',{})||{audienceLevel:form.audienceLevel};
      ops=generateFallbackPlan(gardenData,profile)||[];
    }catch(e){console.warn('[Diagnosis] skip: fallback plan failed:',e.message);}
    try{saveCalendarEvents(ops);}catch(e){}
    const payload={
      irrigazione:irr,manutenzione:mnt,selezioni:multi,
      analisi:{
        stato_generale:'Piano generato in modalita base (saltata diagnosi AI)',
        salute_score:60,
        problemi:[],
        operazione_top:'Conferma il calendario per iniziare',
        operazione_top_nota:'',
        piano_nutrizione:'',
        note_agronomiche:'Diagnosi AI saltata. Verra raffinata alle prossime aperture.',
        operazioni_consigliate:ops
      },
      gddAtSetup:null,
      generatedAt:new Date().toISOString(),
      planSource:'user-skipped',
      soilType: soilType === 'unknown' ? 'loam' : soilType,
      lastIrrigation: lastIrr === 'skip' ? null : lastIrr,
      irrigationSetup:{
        hasIrrigation:irr==='automatica',
        irrigationType:irr==='automatica'?irrType:null,
        flowRateLpm:irr==='automatica'?flowRate:null
      }
    };
    try{S.set('dss_diagnosis_data',payload);}catch(e){}
    try{onComplete(payload);}catch(e){console.error('[Diagnosis] skip onComplete error:',e.message);}
  };

  const cancelAnalysis=()=>{
    console.log('[Diagnosis] User clicked CANCEL');
    setAnalyzing(false);
    setErr('');
    setProgress('');
  };

  if(analyzing)return html`<div style="text-align:center;padding:40px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;min-height:300px">
  <div style="font-size:56px;animation:pdot 2.4s ease-in-out infinite">🌿</div>
  <div class="spinner spinner-g" style="width:36px;height:36px;border-width:3px"></div>
  <div>
    <div style="font-size:15px;font-weight:700;color:var(--text);margin-bottom:6px">Il Dottor Verde sta analizzando il tuo prato...</div>
    <div style="font-size:12px;color:var(--muted);line-height:1.7">Elaborazione in corso (max 12 secondi)</div>
    ${showSlowHint?html`<div style="font-size:12px;color:var(--muted);line-height:1.7;margin-top:8px;max-width:300px">Se non risponde entro 12 secondi, useremo il piano base e lo raffineremo dopo.</div>`:''}
    ${progress?html`<div style="font-size:11px;color:var(--muted);opacity:.85;margin-top:4px">${progress}</div>`:''}
  </div>
  <div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;justify-content:center">
    <button class="btn btn-s" style="font-size:11px;padding:8px 16px;background:var(--green);color:#fff;border:none;border-radius:6px;cursor:pointer;font-weight:600" onClick=${skipDiagnosis}>⏭ Salta diagnosi (usa piano base)</button>
    <button class="btn btn-s" style="font-size:11px;padding:8px 16px;background:#fff;border:1px solid var(--border);border-radius:6px;cursor:pointer" onClick=${cancelAnalysis}>‹ Annulla</button>
  </div>
  ${err?html`<div class="err-box" style="font-size:12px;max-width:300px;text-align:left">${err}<br/><button class="btn btn-s" style="margin-top:8px;font-size:11px" onClick=${()=>setAnalyzing(false)}>‹ Riprova</button></div>`:''}
</div>`;

  return html`<div class="diag-scroll">
    <div style="margin-bottom:18px">
      <div style="font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--green);background:var(--green-l);display:inline-flex;align-items:center;padding:3px 10px;border-radius:99px;margin-bottom:10px">A — Richiesto</div>
      <div style="font-size:13px;font-weight:700;margin-bottom:8px">🚿 Sistema di irrigazione</div>
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:10px">
        <button type="button" onClick=${()=>{setIrr('automatica');}} style=${selBtnGrid(irr==='automatica')}>
          <span style="font-size:22px">🤖</span>
          <span style="font-size:12px;font-weight:600">Automatica</span>
          <span style="font-size:10px;color:var(--muted)">Impianto con timer</span>
        </button>
        <button type="button" onClick=${()=>{setIrr('manuale');setIrrType(null);setFlowRate(null);}} style=${selBtnGrid(irr==='manuale')}>
          <span style="font-size:22px">🚿</span>
          <span style="font-size:12px;font-weight:600">Manuale</span>
          <span style="font-size:10px;color:var(--muted)">A mano / tubo</span>
        </button>
        <button type="button" onClick=${()=>{setIrr('nessuna');setIrrType(null);setFlowRate(null);}} style=${selBtnGrid(irr==='nessuna')}>
          <span style="font-size:22px">🌧️</span>
          <span style="font-size:12px;font-weight:600">Nessuna</span>
          <span style="font-size:10px;color:var(--muted)">Solo pioggia</span>
        </button>
      </div>
      ${irr==='automatica'?html`
        <div style="background:var(--card);padding:10px;border-radius:8px;border:1px solid var(--border);margin-top:6px">
          <div style="font-size:11px;font-weight:600;margin-bottom:6px;color:var(--muted)">DETTAGLI IMPIANTO (opzionale, migliora i calcoli)</div>
          <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:8px">
            ${[['sprinkler','💦 Sprinkler'],['drip','💧 Goccia'],['mixed','🔀 Misto']].map(([v,l])=>html`
              <button type="button" key=${v} onClick=${()=>setIrrType(v)} style=${selBtnSmall(irrType===v)}>${l}</button>
            `)}
          </div>
          <input type="number" placeholder="Portata totale L/min (es. 8)" value=${flowRate!=null&&!Number.isNaN(flowRate)?flowRate:''} onInput=${e=>setFlowRate(parseFloat(e.target.value)||null)} style="width:100%;padding:8px;border:1px solid var(--border);border-radius:6px;font-size:13px;box-sizing:border-box"/>
        </div>
      `:''}
    </div>

    <div style="margin-bottom:18px">
      <div style="font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--green);background:var(--green-l);display:inline-flex;align-items:center;padding:3px 10px;border-radius:99px;margin-bottom:10px">A — Richiesto</div>
      <div style="font-size:13px;font-weight:700;margin-bottom:8px">🌍 Tipo di suolo</div>
      <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:7px">
        <button type="button" onClick=${()=>setSoilType('sandy-loam')} style=${selBtnGrid(soilType==='sandy-loam')}>
          <span style="font-size:20px">🟡</span>
          <span style="font-size:12px;font-weight:600">Franco-Sabbioso</span>
          <span style="font-size:10px;color:var(--muted);text-align:center;line-height:1.3">Leggero, drena rapido<br/>Colline, zone costiere</span>
        </button>
        <button type="button" onClick=${()=>setSoilType('loam')} style=${selBtnGrid(soilType==='loam')}>
          <span style="font-size:20px">🌱</span>
          <span style="font-size:12px;font-weight:600">Franco</span>
          <span style="font-size:10px;color:var(--muted);text-align:center;line-height:1.3">Il più comune, equilibrato<br/>Toscana, Umbria, Centro</span>
        </button>
        <button type="button" onClick=${()=>setSoilType('silt-loam')} style=${selBtnGrid(soilType==='silt-loam')}>
          <span style="font-size:20px">🌾</span>
          <span style="font-size:12px;font-weight:600">Franco-Limoso</span>
          <span style="font-size:10px;color:var(--muted);text-align:center;line-height:1.3">Max riserva idrica<br/>Pianura Padana, Veneto</span>
        </button>
        <button type="button" onClick=${()=>setSoilType('clay-loam')} style=${selBtnGrid(soilType==='clay-loam')}>
          <span style="font-size:20px">🟤</span>
          <span style="font-size:12px;font-weight:600">Franco-Argilloso</span>
          <span style="font-size:10px;color:var(--muted);text-align:center;line-height:1.3">Pesante, drena lento<br/>Lazio, Marche, Po</span>
        </button>
        <button type="button" onClick=${()=>setSoilType('unknown')} style=${{...selBtnGrid(soilType==='unknown'),'grid-column':'1/-1'}}>
          <span style="font-size:20px">❓</span>
          <span style="font-size:12px;font-weight:600">Non lo so</span>
          <span style="font-size:10px;color:var(--muted);text-align:center;line-height:1.3">Useremo Franco come default — potrai cambiarlo dopo</span>
        </button>
      </div>
      <div style="margin-top:10px">
        <button type="button" onClick=${()=>setShowSoilGuide(!showSoilGuide)}
          style="width:100%;display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-radius:.9rem;border:1.5px dashed var(--border);background:var(--card);cursor:pointer;color:var(--text)">

/* PATCH 06D-A — userTraits sticky
   Schema unificato delle scelte permanenti raccolte in onboarding.
   Letto da buildAgroSystemPrompt e da tutta la logica di personalizzazione futura.
   Migration: se profile.userTraits manca, popola da diagnosisData (retrocompat). */
const USER_TRAITS_DEFAULTS = {
  mnt: null,                  // 'base' | 'intermedio' | 'avanzato' | 'professionale'
  utilizzo: [],               // multi: 'Decorativo','Bambini','Animali','Sportivo','Calpestio intenso'
  tempo: null,                // single: '1h/settimana','2-3h/settimana','4-6h/settimana','Illimitato'
  hasIrrigation: null,        // boolean
  irrigationType: null,       // 'sprinkler','drip','manual','none'
  soilType: 'loam',           // 'sandy'|'sandy-loam'|'loam'|'clay-loam'|'clay'
  lastIrrigation: null,       // 'today'|'yesterday'|'2-3days'|'week'|'more'|'skip'
  problemi: [],               // multi: 'Funghi/macchie','Insetti','Zone allagate',...
  aspetto: [],                // multi: 'Verde uniforme','Zone gialle',...
  updatedAt: null
};
function buildUserTraitsFromDiagnosis(diag, profile){
  if (!diag && !profile) return { ...USER_TRAITS_DEFAULTS };
  const multi = diag?.multi || diag?.selezioni || {};
  return {
    ...USER_TRAITS_DEFAULTS,
    mnt: diag?.mnt || diag?.manutenzione || null,
    utilizzo: Array.isArray(multi.utilizzo) ? multi.utilizzo : [],
    tempo: Array.isArray(multi.tempo) ? (multi.tempo[0] || null) : (multi.tempo || null),
    hasIrrigation: profile?.hasIrrigation ?? null,
    irrigationType: profile?.irrigationType || null,
    soilType: profile?.soilType || 'loam',
    lastIrrigation: profile?.lastIrrigation || null,
    problemi: Array.isArray(multi.problemi) ? multi.problemi : [],
    aspetto: Array.isArray(multi.aspetto) ? multi.aspetto : [],
    updatedAt: new Date().toISOString()
  };
}
function ensureUserTraits(profile){
  if (profile?.userTraits && profile.userTraits.updatedAt) return profile;
  const diag = S.get('dss_diagnosis_data', null);
  const traits = buildUserTraitsFromDiagnosis(diag, profile);
  const updated = { ...(profile || {}), userTraits: traits };
  try { S.set('dss_profile', updated); } catch(e) { console.warn('[Lawnly] ensureUserTraits save failed:', e.message); }
  return updated;
}
// Esponi per debug
if (typeof window !== 'undefined') {
  window.__LAWNLY_DEBUG = window.__LAWNLY_DEBUG || {};
  window.__LAWNLY_DEBUG.userTraits = () => (S.get('dss_profile', {}) || {}).userTraits;
  window.__LAWNLY_DEBUG.rebuildUserTraits = () => {
    const p = S.get('dss_profile', {}) || {};
    const diag = S.get('dss_diagnosis_data', null);
    const traits = buildUserTraitsFromDiagnosis(diag, p);
    S.set('dss_profile', { ...p, userTraits: traits });
    return traits;
  };
}

/* ── assignGddWindow: attribuisce a ogni prodotto una finestra GDD basata su
   categoria / NPK / nome. Valori per microterme base 5; per macroterme base 10
   usare valori * 1.5 (moltiplicatore applicato a runtime se serve). Prodotti
   non-stagionali (surfattanti, ammendanti umici, micorrize, NPK bilanciati) →
   gddWindow=null (sempre validi). ───────────────────────────────────────── */
function assignGddWindow(p){
  const name=(p.name||'').toLowerCase();
  const cat=(p.cat||p.type||'').toLowerCase();
  const npk=(p.npk||'').toString();
  // Parse NPK "27-0-14" → [27,0,14]
  const nums=npk.match(/(\d+(?:\.\d+)?)/g)?.map(Number)||[];
  const [N=0,P=0,K=0]=nums;
  // Famiglia 1: STARTER (P alto) — concimi per semine / radicanti
  if(P>=15||name.includes('starter')||name.includes('pro start')||name.includes('radical')||name.includes('germi')){
    return{min:100,max:500,stage:'risveglio'};
  }
  // Famiglia 2: PRE-INVERNALE / ANTISTRESS (K alto, N basso)
  if(K>=18&&N<=12){
    return{min:1800,max:2800,stage:'pre_dormienza'};
  }
  // Famiglia 3: SPINTA VEGETATIVA (N alto)
  if(N>=20||name.includes('sprint n')||name.includes('speed green')||name.includes('invigorator')||name.includes('high n')){
    return{min:150,max:1800,stage:'crescita_attiva'};
  }
  // Famiglia 4: BIOSTIMOLANTE ANTI-STRESS (alghe, silicio)
  if(name.includes('pre-stress')||name.includes('prestress')||name.includes('si strong')||name.includes('stress')||name.includes('alghe')){
    return{min:1200,max:2500,stage:'stress_estivo'};
  }
  // Famiglia 5: BIOATTIVATO micorrizico (T suolo 15-25°C)
  if(cat==='bioattivato'||name.includes('fly')||name.includes('thur')||name.includes('tryko')||name.includes('joker bio')){
    return{min:200,max:1500,stage:'crescita_attiva'};
  }
  // Famiglia 6: FERRO / COLORE (ampio range)
  if(name.includes('iron')||name.includes('ferro')||name.includes('eddha')){
    return{min:300,max:2500,stage:null};
  }
  // Famiglia 7: NPK bilanciato / liquido / ammendante / micorrize → null (sempre valido)
  return null;
}

function upcomingForecastDays(wx){const a=(wx&&(wx.forecast7||wx.forecast||(Array.isArray(wx.daily)?wx.daily:null)))||[];if(!Array.isArray(a)||!a.length)return [];const td=new Date().toLocaleDateString('sv-SE');const fut=a.filter(d=>((d.date||d.dt||'')>=td));return (fut.length?fut:a).slice(0,8);}
function _expoLabP(e){e=(e||'').toString().toLowerCase();if(e.includes('mezz')||e.includes('part'))return"mezz'ombra";if(e.includes('sun')||e.includes('sole'))return'pieno sole';if(e.includes('shade')||e.includes('ombra'))return'ombra';return e||'';}
function soilStateText(m){if(!m)return'Nessuna misura recente.';const p=[];if(m.um!=null)p.push(m.um<25?'asciutto in superficie':(m.um>65?'ben idratato':'umidità adeguata'));if(m.ph!=null)p.push((m.ph>=6&&m.ph<=7)?'pH ottimale per le microterme':(m.ph<6?'pH acido, valuta correzione':'pH basico, valuta correzione'));if(m.ts!=null&&m.ts>=28)p.push('temperatura del suolo elevata');return p.length?(p.join(', ')+'.'):'Misura registrata.';}
function _photoSrc(p){
  const inline=inlineZonePhoto(p);if(inline)return inline;
  if(!p?.remoteId)return'';
  const key=zonePhotoKey(p),cached=_zonePhotoCache.get(key);if(cached)return cached;
  if(!_zonePhotoLoads.has(key))readZonePhoto(p).then(()=>window.dispatchEvent(new CustomEvent('lawnly:photo-loaded'))).catch(e=>console.warn('[photo]',e.message));
  return'';
}

  const latest=(zid)=>{const a=soilData.filter(d=>d.zona===zid&&d.dt).sort((x,y)=>(y.dt||'').localeCompare(x.dt||''));return a[0]||soilData.filter(d=>d.zona===zid)[0]||null;};
  const areaLab=(z)=>{const a=z.area||z.m2||0;return a?(a+' m²'):'';};
  const phaseLab=(z)=>{const q=(z.phase||z.fase||'').toString().toLowerCase();if(q.includes('semin'))return'semina';if(q.includes('pos'))return'posa';if(q.includes('matur'))return'maturo';return'';};
  const zsub=(z)=>[areaLab(z),_expoLabP(z.exposure),phaseLab(z)].filter(Boolean).join(' · ');
  const scoreCls=(s)=>(s==null)?'':(s>=80?'g':'a');

  const phM=(v)=>v==null?null:{val:(+v).toFixed(1),w:Math.max(4,Math.min(100,((v-4)/5)*100)),c:(v>=6&&v<=7)?'var(--green)':((v>=5.5&&v<=7.6)?'var(--amber)':'var(--red)')};
  const umM=(v)=>v==null?null:{val:Math.round(v)+'%',w:Math.max(4,Math.min(100,v)),c:(v<25)?'var(--amber)':((v<=65)?'var(--green)':'var(--amber)')};
  const tsM=(v)=>v==null?null:{val:(+v).toFixed(1)+'°',w:Math.max(4,Math.min(100,(v/40)*100)),c:(v<24)?'var(--green)':((v<28)?'var(--amber)':'var(--red)')};

    </div></div>

      ${zones.length>1?html`<div class="seg2 soilseg">${zones.map(z=>html`<div key=${z.id} class=${'seg2t'+(selSoil===z.id?' on':'')} onClick=${()=>setSelSoil(z.id)}>${z.name||('Zona '+z.id)}</div>`)}</div>`:''}
      ${sel==null?html`<div class="zp-empty">Nessuna misura per questa zona.<br/>Aggiungi una misurazione del suolo.</div>`:html`<div class="soil-zone">
        ${mrow('pH',phM(sel.ph))}${mrow('Fertilità',fertM(sel.ec))}${mrow('Umidità',umM(sel.um))}${mrow('Temp.',tsM(sel.ts))}
        <div class="soil-state"><b>Stato:</b> ${soilStateText(sel)}</div>
      </div>`}
    </div>

    <div class="card fade">
      <div class="rf-head"><span class="rf-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 13v8M8 21h8"/><path d="M4 11a8 8 0 0 1 16 0Z"/></svg></span><div><div class="rf-t">Rischio fungino</div><div class="rf-st" style=${frInfo?('color:'+frInfo.c):''}>${frInfo?frInfo.l:'Dati meteo non disponibili'}</div></div></div>

        <div class="rf-banner">${winOpen?'Finestra aperta nelle prossime 48h':'Attendi condizioni migliori'}</div>

function DottorVerdeChat({prof,wx,onClose}){
  const zones=(prof&&prof.zones&&prof.zones.length)?prof.zones:[{id:'A',name:'Zona A'}];
  const nm=(prof&&(prof.userName||prof.gardenName||prof.ownerName))||'';
  const salute=(()=>{try{const d=S.get('dss_diagnosis_data',null);return d&&d.analisi&&d.analisi.salute_score!=null?d.analisi.salute_score:null;}catch(e){return null;}})();

    try{
      const h=(S.get('dss_consultant_chat',[])||[]).filter(m=>m&&m.content).map(m=>({role:m.role==='user'?'user':'bot',text:m.content}));

  });

  },[msgs]);
  const [input,setInput]=useState('');
  const [busy,setBusy]=useState(false);
  const [pending,setPending]=useState(null);
  const [planProp,setPlanProp]=useState(null);
  const fileRef=useRef(null);
  const endRef=useRef(null);
  useEffect(()=>{try{endRef.current&&endRef.current.scrollIntoView({behavior:'smooth',block:'end'});}catch(e){}},[msgs,pending,busy]);
  const closeX=html`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>`;
  const buildSys=()=>{
    const evs=(S.get('dss_calendar_events',[])||[]).filter(e=>e&&!e.done&&e.status!=='completato').slice(0,8).map(e=>'- '+(e.name||e.title||'op')+' · '+(e.date||'')+(e.product?(' · '+e.product):'')).join('\n');

    return 'Sei il Dottor Verde, agronomo esperto di prati. Rispondi SEMPRE in italiano, conciso, pratico e concreto. Usa il contesto reale dell\'utente.\n'+
      '<contesto>\nPrato: '+((prof&&prof.grassMixture)||'microterme')+' · '+zones.length+' zone · '+((prof&&prof.totalArea)||'?')+' m²\n'+
      'Località: '+((prof&&(prof.city||prof.location))||'?')+'\nGDD '+new Date().getFullYear()+': '+((wx&&wx.gddTotal!=null)?Math.round(wx.gddTotal):'?')+'\n'+
      'Salute prato: '+(salute!=null?(salute+'/100'):'n/d')+'\n</contesto>\n'+
      '<piano_prossime_operazioni>\n'+(evs||'(nessuna pianificata)')+'\n</piano_prossime_operazioni>\n'+
      '<ultime_irrigazioni>\n'+(irr||'(nessuna registrata)')+'\n</ultime_irrigazioni>'+
      '\n\nQuando proponi UNA operazione concreta da aggiungere al calendario, chiedi sempre conferma all\'utente e termina il messaggio con UNA riga esatta in questo formato (niente testo dopo): [[PLAN]]{"name":"...","category":"concimazione|irrigazione|meccanica|trattamento","date":"YYYY-MM-DD","product":"...","doseGm2":0}[[/PLAN]] — product e doseGm2 sono opzionali.'+
      '\nSe l\'utente conferma (anche solo "sì", "ok", "procedi", "aggiorna il piano"), riemetti il blocco [[PLAN]] con le operazioni concordate: senza quel blocco il calendario NON cambia, quindi non dire mai di averlo aggiornato. Per più operazioni usa un array: [[PLAN]][{...},{...}][[/PLAN]].';

      setMsgs(m=>[...m,{role:'bot',text:reply||'…'}]);

      if(props.length)setPlanProp(props.length===1?props[0]:props);
    }catch(e){setMsgs(m=>[...m,{role:'bot',text:'Non riesco a rispondere adesso ('+((e&&e.message)||'errore')+'). Serve connessione e login attivo.'}]);}
    setBusy(false);
  };
  const onFile=(e)=>{

  const pickZone=async(z)=>{

      const sum=analysis&&(analysis.summary||analysis.descrizione||analysis.text||'');
      setMsgs(m=>[...m,{role:'bot',text:(sc!=null?('Voto manto: '+sc+'/10. '):'')+(sum||'Analisi completata: la trovi in "Il mio prato" sotto la zona, con lo storico foto.')}]);
    }catch(e){setMsgs(m=>[...m,{role:'bot',text:'Foto salvata in "Il mio prato". L\'analisi AI non è riuscita adesso ('+((e&&e.message)||'offline')+'); verrà completata in automatico appena possibile.'}]);}
    setBusy(false);

      if(!applyCalendarOperation(ev).ok)return;

    setMsgs(m=>[...m,{role:'bot',text:'Fatto ✓ Ho aggiunto '+lbl+' al piano. Lo trovi nella sezione Piano.'}]);

  const quick=['Quanto devo irrigare questa settimana?','Cosa devo fare adesso sul prato?','Analizza una foto'];

function _wxIcon(code,precip){const c=(code!=null&&!isNaN(+code))?+code:null;if(c!=null){if(c<=2)return'sun';if(c<=48)return'cloud';return'rain';}if(precip!=null&&precip>0.5)return'rain';return'sun';}
function _wxSvg(kind){
  if(kind==='rain')return html`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 12.5a4 4 0 1 1-7-2.6 6 6 0 1 1 10 3.3"/><line class="drop d1" x1="8" y1="18" x2="8" y2="20.5"/><line class="drop d2" x1="12" y1="18" x2="12" y2="21.5"/><line class="drop d3" x1="16" y1="18" x2="16" y2="20.5"/></svg>`;
  if(kind==='cloud')return html`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 18a4 4 0 0 0 0-8 6 6 0 0 0-11.3-1.5A4.5 4.5 0 0 0 6 18Z"/></svg>`;
  return html`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><g class="rays"><path d="M12 2v2.4M12 19.6V22M4.2 4.2l1.7 1.7M18.1 18.1l1.7 1.7M2 12h2.4M19.6 12H22M4.2 19.8l1.7-1.7M18.1 5.9l1.7-1.7"/></g><circle class="core" cx="12" cy="12" r="4.3"/></svg>`;
}
function Meteo2({wx,prof}){
  const city=(prof&&(prof.city||prof.location||prof.gardenCity))||'Meteo';
  const fc=upcomingForecastDays(wx);
  const todayTemp=(()=>{let t=wx?.todayData?.tmax ?? wx?.current?.tmax ?? (fc[0]&&fc[0].tmax);t=Math.round(t);return isNaN(t)?null:t;})();
  let condLabel=wx?.todayData?.condition||wx?.weatherLabel||null;
  try{if(!condLabel){const code=wx?.todayData?.weathercode??wx?.current?.weathercode;if(code!=null&&typeof wmoCodeToIcon==='function')condLabel=wmoCodeToIcon(code).label;}}catch(e){}
  const hum=wx?.todayData?.humidity ?? wx?.current?.humidity;
  const app=wx?.todayData?.apparent ?? wx?.current?.apparent_temperature;
  const days=fc.slice(0,6).map((d,i)=>{const dt=new Date(d.date||d.dt||Date.now());const lbl=i===0?'Oggi':dt.toLocaleDateString('it-IT',{weekday:'short'}).replace('.','').replace(/^./,c=>c.toUpperCase());const t=Math.round(d.tmax);return{lbl,t:isNaN(t)?null:t,kind:_wxIcon(d.weathercode??d.weather_code,d.precipitation??d.rain)};});
  const temps=days.map(d=>d.t).filter(v=>v!=null);
  const peak=temps.length?Math.max(...temps):null;
  const peakIdx=days.findIndex(d=>d.t===peak);
  const peakLbl=peakIdx>=0?days[peakIdx].lbl:null;
  const STRESS=28;
  const overCount=days.filter(d=>d.t!=null&&d.t>=STRESS).length;
  const heatComing=overCount>0;
  const heatDayIdx=days.findIndex(d=>d.t!=null&&d.t>=STRESS);
  const heatDayLbl=heatComing?days[heatDayIdx].lbl.toLowerCase():null;
  let chart=null;
  if(temps.length>=2){
    const lo=Math.min(Math.min(...temps),STRESS)-2,hi=Math.max(Math.max(...temps),STRESS)+2;
    const X=(i)=>10+i*(280/(days.length-1)),Y=(t)=>118-((t-lo)/(hi-lo))*102;
    const pts=days.map((d,i)=>d.t==null?null:({x:+X(i).toFixed(1),y:+Y(d.t).toFixed(1),t:d.t,lbl:d.lbl})).filter(Boolean);
    chart={pts,line:pts.map(p=>p.x+','+p.y).join(' '),area:pts.map(p=>p.x+','+p.y).join(' ')+' '+pts[pts.length-1].x+',118 '+pts[0].x+',118',yThr:+Y(STRESS).toFixed(1)};
  }
  return html`<div class="rdz">
    <div class="rdz-ambient"></div>
    <div class="head"><div><div class="page-eyebrow">${city}</div><div class="page-title"><span class="serif">Meteo</span></div></div></div>

    <div class="card fade"><div class="mt-hero">
      <div><div class="mt-temp"><span>${todayTemp==null?'—':html`<${Num} end=${todayTemp}/>`}</span><span class="deg">°</span></div>
        <div class="mt-cond">${condLabel?html`<b>${condLabel}</b>`:'—'}${app!=null?(' · percepiti '+Math.round(app)+'°'):''}${hum!=null?(' · umidità '+Math.round(hum)+'%'):''}</div></div>
      <div class="mt-thermo"><svg class="mt-thermo2" viewBox="0 0 40 104" fill="none" aria-hidden="true"><g stroke="var(--t4)" stroke-width="2" stroke-linecap="round" opacity=".65"><line x1="26.5" y1="17" x2="31.5" y2="17"/><line x1="26.5" y1="27" x2="29.5" y2="27"/><line x1="26.5" y1="37" x2="31.5" y2="37"/><line x1="26.5" y1="47" x2="29.5" y2="47"/><line x1="26.5" y1="57" x2="31.5" y2="57"/></g><rect x="12.5" y="8" width="13" height="63" rx="6.5" fill="rgba(255,255,255,.55)" stroke="var(--line)" stroke-width="2"/><circle cx="19" cy="83" r="13.5" fill="rgba(255,255,255,.55)" stroke="var(--line)" stroke-width="2"/><circle cx="19" cy="83" r="9.5" fill="#E2573F"/><rect class="merc-col" x="15.5" y="22" width="7" height="61" rx="3.5" fill="#E2573F"/><rect x="15" y="13" width="2.6" height="54" rx="1.3" fill="#fff" opacity=".45"/></svg></div>
    </div></div>

    <div class="card fade"><div class="c-eye"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="3"/><path d="M3 10h18M8 2v4M16 2v4"/></svg> Prossimi ${days.length} giorni</div>
      ${days.length?html`<div class="fc">${days.map((d,i)=>html`<div key=${i} class=${'fcd'+(i===0?' on':'')}><span class="fcd-d">${d.lbl}</span><span class=${'wx wx-'+d.kind}>${_wxSvg(d.kind)}</span><span class="fcd-t">${d.t==null?'—':d.t+'°'}</span></div>`)}</div>`:html`<div class="zp-empty">Previsioni non disponibili.</div>`}
      ${peak!=null?html`<div class="mt-fctext">Massime fino a <b>${peak}°${peakLbl?(' '+peakLbl.toLowerCase()):''}</b>.${heatComing?' Attenzione al caldo in aumento da '+heatDayLbl+'.':' Condizioni stabili.'}</div>`:''}
    </div>

    <div class="card verdict warn fade">
      <div class="verdict-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h16.9a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/><line x1="12" y1="9" x2="12" y2="13"/><path d="M12 17h.01"/></svg></div>
      <div style="flex:1;min-width:0;"><div class="verdict-q">Impatto sul prato</div><div class="verdict-a">${heatComing?('Stress termico in arrivo'+(heatDayLbl?' '+heatDayLbl:'')):'Nessuna criticità climatica'}</div></div>
    </div>

    ${(heatComing&&chart)?html`<div class="card fade" style="margin-top:-8px;">
      <div class="mt-imp-d">Le massime superano la <b>soglia di stress termico per le microterme (${STRESS}°C)</b>${heatDayLbl?(' da '+heatDayLbl):''}. Il prato riduce la fotosintesi, consuma più acqua ed è più esposto ai funghi. <b>Anticipa il biostimolante antistress</b>, alza il taglio per ombreggiare il suolo e sposta l'irrigazione al mattino presto.</div>
      <div class="mt-chart"><svg viewBox="0 0 300 134"><defs><linearGradient id="mtg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#DE8E2C" stop-opacity=".35"/><stop offset="1" stop-color="#DE8E2C" stop-opacity="0"/></linearGradient></defs>
        <line class="mt-cthresh" x1="10" y1=${chart.yThr} x2="290" y2=${chart.yThr}/>

const _MESI3=['gen','feb','mar','apr','mag','giu','lug','ago','set','ott','nov','dic'];
const _MESIF=['Gennaio','Febbraio','Marzo','Aprile','Maggio','Giugno','Luglio','Agosto','Settembre','Ottobre','Novembre','Dicembre'];
function _isoWeek(d){const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const dy=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-dy);const ys=new Date(Date.UTC(t.getUTCFullYear(),0,1));return Math.ceil((((t-ys)/86400000)+1)/7);}
function _monday(d){const x=new Date(d);const dy=(x.getDay()||7);x.setDate(x.getDate()-(dy-1));return x;}
function _weekRange(d){const mo=_monday(d);const su=new Date(mo);su.setDate(mo.getDate()+6);const a=mo.getDate(),b=su.getDate();return mo.getMonth()===su.getMonth()?(a+' – '+b+' '+_MESI3[su.getMonth()]):(a+' '+_MESI3[mo.getMonth()]+' – '+b+' '+_MESI3[su.getMonth()]);}

  misura:_svg(html`<path d="M9 3v6l-5 9a2 2 0 0 0 2 3h12a2 2 0 0 0 2-3l-5-9V3"/><path d="M8 3h8"/>`),
  fungo:_svg(html`<path d="M12 2 4 5v6c0 5 3.5 8.5 8 10 4.5-1.5 8-5 8-10V5l-8-3Z"/>`),

};
function _opCat(c){c=(c||'').toLowerCase();
  if(/semin|trasem|risem|overseed/.test(c))return{cls:'ic-a',i:_ICO.semina};
  if(/taglio|mecc|sfalc/.test(c))return{cls:'ic-g',i:_ICO.taglio};

 {t:'Taglio regolare',id:'taglio',g:'GDD 50 – 800+',ic:'taglio',d:'Mantieni l’altezza ottimale rispettando la regola del terzo: non rimuovere mai più di 1/3 della lunghezza in un solo taglio. Taglia a prato asciutto, con lame affilate.'},
